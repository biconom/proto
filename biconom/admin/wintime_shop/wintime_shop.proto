syntax = "proto3";

package biconom.admin.wintime_shop;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "biconom/types/account.proto";
import "biconom/types/distributor.proto";
import "biconom/types/slot.proto";
import "biconom/types/transaction.proto";
import "biconom/types/wintime_shop.proto";

// WintimeShopAdminService — админское управление WinTime-магазином.
//
// Три зоны ответственности:
//   1. Каталог: создать/обновить определение товара (название, цена в WinTime,
//      семейство, привязка к дереву для лицензий), включить/выключить продажу.
//   2. Тираж:
//        * TREE_LICENSE — целочисленная квота остатка: добавить N / отнять N /
//          установить значение.
//        * TEXT_COUPON — пул текстовых кодов: массовая загрузка новых кодов с
//          проверкой уникальности В ПРЕДЕЛАХ ТОВАРА (дубли внутри товара
//          отклоняются; одинаковый код у разных товаров — допустим).
//   3. Статистика: остаток и сколько всего продано.
//
// Доступ — только под Permission::ROOT.
service WintimeShopAdminService {
    // ─── Каталог ──────────────────────────────────────────────────────

    // Создать или обновить определение товара. Если `id == 0` — создаётся новый
    // товар (id назначается сервером и возвращается); при создании обязателен
    // уникальный `code`. Если `id != 0` — товар с этим id обновляется; семейство
    // `kind` и строковый `code` менять нельзя (иначе InvalidArgument).
    rpc UpsertProduct(UpsertProductRequest) returns (biconom.types.WintimeShop.Product);

    // Список всех товаров (включая недоступные) — для админ-панели.
    rpc ListProducts(google.protobuf.Empty) returns (biconom.types.WintimeShop.Product.List);

    // Включить/выключить доступность товара к покупке.
    rpc SetAvailability(SetAvailabilityRequest) returns (biconom.types.WintimeShop.Product);

    // ─── Тираж: лицензии дерева (TREE_LICENSE) ────────────────────────

    // Изменить квоту остатка товара-лицензии. Операция задаётся `op` (ADD /
    // SUBTRACT / SET). Для товаров семейства TEXT_COUPON — InvalidArgument
    // (у купонов тираж управляется загрузкой кодов, а не счётчиком).
    rpc AdjustLicenseStock(AdjustLicenseStockRequest) returns (biconom.types.WintimeShop.Product);

    // ─── Тираж: купоны (TEXT_COUPON) ──────────────────────────────────

    // Массово загрузить текстовые коды в пул товара. Каждый код: trim по краям,
    // дубли внутри запроса схлопываются (уникальность). Далее по текущему
    // статусу кода в пуле товара:
    //   * отсутствует        → добавляется как НОВЫЙ (added);
    //   * НОВЫЙ              → игнорируется (skipped_duplicates);
    //   * ОТМЕНЁННЫЙ         → повторно активируется: Cancelled → New
    //                          (reactivated, статистика статусов обновляется);
    //   * ВЫДАННЫЙ           → отклоняется — код уже активирован/выдан
    //                          пользователю (skipped_dispensed).
    // Для TREE_LICENSE — InvalidArgument.
    rpc LoadCoupons(LoadCouponsRequest) returns (LoadCouponsResponse);

    // Отменить коды в пуле товара-купона. Отменить можно только НОВЫЙ
    // (невыданный) код; выданные и уже отменённые пропускаются (см. счётчики
    // ответа). Отменённый код можно вернуть в продажу повторной загрузкой через
    // LoadCoupons (Cancelled → New). Для TREE_LICENSE — InvalidArgument.
    rpc CancelCoupons(CancelCouponsRequest) returns (CancelCouponsResponse);

    // Постраничный список кодов пула товара-купона с их статусами (для
    // админ-панели: видно, какие коды новые / выданные / отменённые).
    // Для TREE_LICENSE — InvalidArgument.
    rpc ListCoupons(ListCouponsRequest) returns (ListCouponsResponse);

    // ─── Статистика ───────────────────────────────────────────────────

    // Сводная статистика по товару (остаток, всего продано, доступность).
    rpc GetStats(biconom.types.WintimeShop.Product.Id) returns (biconom.types.WintimeShop.Stats);

    // ─── История покупок ──────────────────────────────────────────────

    // ВСЯ история покупок дистрибьютора (новые сверху) — БЕЗ пагинации и
    // фильтров, одним ответом. `distributor_id` обязателен (0 →
    // InvalidArgument). Возвращаются те же визуальные блоки транзакций, что и
    // в клиентском `TransactionService.History`, упакованные глазами аккаунта
    // дистрибьютора — саппорт видит ровно те «отфильтрованные транзакции»
    // магазина, что и сам пользователь. Детали покупки — в entry.details
    // (`WintimeShopPurchaseDetails`: product_id, coupon_code, slot/voucher/tree).
    rpc ListPurchases(ListPurchasesRequest) returns (ListPurchasesResponse);
}

// Запрос создания/обновления товара.
message UpsertProductRequest {
    // 0 — создать новый товар; иначе — обновить существующий (адресация по id).
    uint32 id = 1;
    // Строковый slug товара. ОБЯЗАТЕЛЕН при создании (`id == 0`): уникальный,
    // нормализуется сервером (trim по краям, нижний регистр) и обязан соответствовать
    // `[a-z0-9_]+` — иначе InvalidArgument. При обновлении (`id != 0`) игнорируется
    // (code неизменяем).
    string code = 2;
    // Семейство товара. При обновлении должно совпадать с текущим.
    biconom.types.WintimeShop.Product.Kind kind = 3;
    // Цена в WinTime-токенах (целое; WIN_TIME precision 0). Должна быть > 0.
    uint64 price_wintime = 4;
    // Доступность к покупке сразу после создания/обновления.
    bool available = 5;

    // Специфика семейства (обязана соответствовать `kind`).
    oneof spec {
        biconom.types.WintimeShop.Product.TreeLicenseSpec tree_license = 6;
        biconom.types.WintimeShop.Product.TextCouponSpec text_coupon = 7;
    }
}

// Запрос переключения доступности.
message SetAvailabilityRequest {
    // Товар — по числовому id или строковому code.
    biconom.types.WintimeShop.Product.Id product = 1;
    bool available = 2;
}

// Запрос изменения квоты остатка лицензии.
message AdjustLicenseStockRequest {
    // Товар — по числовому id или строковому code.
    biconom.types.WintimeShop.Product.Id product = 1;

    // Вид операции над квотой остатка.
    enum Op {
        OP_UNSPECIFIED = 0;
        OP_ADD = 1;      // Добавить `amount` к остатку.
        OP_SUBTRACT = 2; // Отнять `amount` от остатка; ниже нуля не уходит — клампится к 0 (5 − 7 = 0).
        OP_SET = 3;      // Установить остаток равным `amount`.
    }
    Op op = 2;

    // Аргумент операции (интерпретация зависит от `op`).
    uint64 amount = 3;
}

// Запрос массовой загрузки купонов.
message LoadCouponsRequest {
    // Товар — по числовому id или строковому code.
    biconom.types.WintimeShop.Product.Id product = 1;
    // Текстовые коды. Каждый код: trim по краям; после trim — непустой и не
    // длиннее 64 символов (иначе InvalidArgument, запрос отклоняется ЦЕЛИКОМ —
    // ничего не добавляется). Пустой список — InvalidArgument.
    repeated string codes = 2;
}

// Сводка массовой загрузки купонов.
message LoadCouponsResponse {
    // Сколько НОВЫХ кодов добавлено в пул.
    uint64 added = 1;
    // Сколько проигнорировано как дубли (уже в пуле со статусом NEW или повтор
    // внутри запроса).
    uint64 skipped_duplicates = 2;
    // Остаток пула (новых кодов) после загрузки.
    uint64 stock_remaining = 3;
    // Ранее ОТМЕНЁННЫЕ коды, повторно активированные этой загрузкой (Cancelled → New).
    uint64 reactivated = 4;
    // Отклонено: код уже АКТИВИРОВАН — выдан другому пользователю (Dispensed).
    uint64 skipped_dispensed = 5;
}

// Статус текстового кода в пуле товара-купона.
enum CouponStatus {
    COUPON_STATUS_UNSPECIFIED = 0; // Не задан (в фильтре ListCoupons = все статусы).
    COUPON_STATUS_NEW = 1;         // Новый: свободен к выдаче.
    COUPON_STATUS_DISPENSED = 2;   // Выдан покупателю.
    COUPON_STATUS_CANCELLED = 3;   // Отменён администратором.
}

// Запрос отмены кодов пула.
message CancelCouponsRequest {
    // Товар — по числовому id или строковому code.
    biconom.types.WintimeShop.Product.Id product = 1;
    // Коды к отмене (trim по краям; пустые и дубли внутри запроса схлопываются).
    repeated string codes = 2;
}

// Сводка отмены кодов.
message CancelCouponsResponse {
    uint64 cancelled = 1;          // Отменено этим запросом.
    uint64 skipped_not_found = 2;  // Кода нет в пуле товара.
    uint64 skipped_dispensed = 3;  // Уже выдан покупателю — отмена невозможна.
    uint64 skipped_cancelled = 4;  // Уже был отменён ранее.
    uint64 stock_remaining = 5;    // Остаток свободных (новых) кодов после отмены.
}

// Запрос списка кодов пула.
message ListCouponsRequest {
    // Товар — по числовому id или строковому code.
    biconom.types.WintimeShop.Product.Id product = 1;
    // Фильтр по статусу; COUPON_STATUS_UNSPECIFIED — все статусы.
    CouponStatus status = 2;
    // Максимум записей в ответе (0 или больше глобального лимита → 1000).
    uint32 limit = 3;
    // Смещение от начала (коды отсортированы лексикографически).
    uint32 offset = 4;
}

// Страница кодов пула.
message ListCouponsResponse {
    // Код, его статус, даты жизненного цикла и получатель.
    message Item {
        string code = 1;
        CouponStatus status = 2;
        // Когда код загружен в пул (реактивация НЕ меняет).
        google.protobuf.Timestamp created_at = 3;
        // Последняя смена статуса (загрузка / реактивация / выдача / отмена).
        google.protobuf.Timestamp updated_at = 4;
        // Кому выдан код (distributor_id покупателя); 0 — не выдан.
        // По выданным кодам восстановима статистика «кто какие купоны купил».
        uint32 distributor_id = 5;
    }

    repeated Item items = 1;
    // Всего кодов под выбранным фильтром (для пагинации).
    uint64 total = 2;
}

// Запрос истории покупок дистрибьютора.
message ListPurchasesRequest {
    // Покупатель. Обязателен (0 → InvalidArgument).
    uint32 distributor_id = 1;
}

// ПОЛНАЯ история покупок — формат клиентского `TransactionService.History`.
message ListPurchasesResponse {
    // Блоки транзакций ВСЕХ покупок, новые сверху (одна покупка = одна группа).
    repeated biconom.types.Transaction.Group items = 1;
    // Дедуплицированный список аккаунтов, упомянутых в транзакциях.
    repeated biconom.types.Account accounts = 2;
    // Дедуплицированный список дистрибьюторов, упомянутых в транзакциях.
    repeated biconom.types.Distributor distributors = 3;
    // Дедуплицированный список маркетинговых слотов, упомянутых в транзакциях.
    repeated biconom.types.Slot slots = 4;
}
