syntax = "proto3";

package biconom.admin.dividend_pool;

import "google/protobuf/empty.proto";
import "biconom/types/dividend_pool.proto";

// DividendPoolAdminService — административный сервис управления дивидендным пулом.
//
// Позволяет администратору контролировать глобальное состояние модуля:
// включать, приостанавливать или полностью останавливать механику дивидендов.
// Требует permission ADMIN_FINANCE (EnrollAutoReinvestAll — ROOT).
service DividendPoolAdminService {
    // Получить текущий статус и статистику дивидендного пула.
    rpc GetStatus(google.protobuf.Empty) returns (GetStatusResponse);

    // Изменить глобальный статус сервиса (Active / Paused / Stopped).
    // Изменение вступает в силу немедленно и персистится в RocksDB.
    rpc SetStatus(SetStatusRequest) returns (google.protobuf.Empty);

    // Массовая активация: сгенерировать первый pending-бонус для всех дистрибьюторов
    // у которых invested > 0, но ещё нет user_state.
    // Эквивалент первого нажатия ClaimDividendPool каждым пользователем.
    // Требует статус Active. Возвращает количество активированных.
    rpc ActivateAll(google.protobuf.Empty) returns (ActivateAllResponse);

    // Установить статус (active) последнего состояния авто-реинвеста дистрибьютора.
    // Пользователь сам отменить авто-реинвест не может — только админ.
    // Ошибка DIVIDEND_POOL_AUTO_REINVEST_NOT_FOUND, если состояния нет.
    rpc SetDistributorAutoReinvestStatus(SetDistributorAutoReinvestStatusRequest) returns (SetDistributorAutoReinvestStatusResponse);

    // Массово включить авто-реинвест на `cycles` циклов всем, кто может, но не в
    // реинвесте: инвестиция в пул есть (правило ActivateAll), активного авто-реинвеста
    // нет. Завершённые (циклы исчерпаны) включаются заново. Процент — снэпшот ТЕКУЩЕГО
    // тарифа конфигурации на `cycles` циклов, как при выборе самим партнёром.
    //
    // Не трогает активные состояния: ни процент, ни счётчик циклов не меняются.
    // Выключенных администратором пропускает, пока не задан `include_admin_disabled`.
    // Повторный вызов безопасен — уже включённые считаются в `already_active`.
    // `dry_run` возвращает те же счётчики без изменений.
    //
    // Требует permission ROOT (строже остальных методов сервиса: отката нет —
    // выключать обратно только поштучно через SetDistributorAutoReinvestStatus).
    // Ошибки (ничего не изменено): DIVIDEND_POOL_SERVICE_NOT_ACTIVE,
    // DIVIDEND_POOL_NO_DAILY_RATE, DIVIDEND_POOL_AUTO_REINVEST_INVALID_CYCLES,
    // DIVIDEND_POOL_AUTO_REINVEST_NOT_CONFIGURED.
    rpc EnrollAutoReinvestAll(EnrollAutoReinvestAllRequest) returns (EnrollAutoReinvestAllResponse);
}

// Ответ с текущим статусом и агрегированной статистикой.
message GetStatusResponse {
    // Текущий глобальный статус: ACTIVE, PAUSED или STOPPED.
    biconom.types.DividendPool.ServiceStatus.Id status = 1;

    // Количество пользователей с активным pending-бонусом.
    uint32 total_active_users = 2;

    // Последний сгенерированный дневной процент (например "0.2667").
    // Пустая строка если ни одного процента ещё не было.
    string latest_daily_rate = 3;

    // Дата последнего процента в формате YYYYMMDD (например 20260226).
    // 0 если ни одного процента ещё не было.
    uint32 latest_daily_rate_date = 4;

    // Суммарный объём USDT, вложенный всеми пользователями (формат mantissa).
    string total_invested = 5;
}

// Запрос на изменение глобального статуса.
message SetStatusRequest {
    // Новый статус. UNSPECIFIED вернёт ошибку DIVIDEND_POOL_INVALID_STATUS.
    biconom.types.DividendPool.ServiceStatus.Id status = 1;
}

// Ответ на массовую активацию.
message ActivateAllResponse {
    // Количество дистрибьюторов, для которых был сгенерирован первый бонус.
    uint32 activated_count = 1;
}

// Запрос на изменение статуса авто-реинвеста дистрибьютора.
message SetDistributorAutoReinvestStatusRequest {
    // Дистрибьютор, чьё состояние авто-реинвеста меняем.
    uint32 distributor_id = 1;

    // Новый статус: true — включить, false — выключить.
    bool active = 2;
}

// Ответ с обновлённым состоянием авто-реинвеста.
message SetDistributorAutoReinvestStatusResponse {
    biconom.types.DividendPool.AutoReinvestState state = 1;
}

// Запрос на массовое включение авто-реинвеста.
message EnrollAutoReinvestAllRequest {
    // Срок в циклах клейма (на проде цикл — сутки). Должен совпадать с тарифом
    // конфигурации, иначе DIVIDEND_POOL_AUTO_REINVEST_INVALID_CYCLES.
    uint32 cycles = 1;

    // true — включить и тех, кому авто-реинвест выключил администратор.
    // По умолчанию (false) их запрет сильнее массового включения.
    bool include_admin_disabled = 2;

    // true — только посчитать, кого затронет; состояние не меняется.
    bool dry_run = 3;
}

// Итог массового включения (при dry_run — прогноз, ничего не изменено).
message EnrollAutoReinvestAllResponse {
    // Процент дисконта, с которым включены партнёры (например "40.0000").
    string discount_percent = 1;

    // Включено: инвестиция есть, состояния не было или циклы исчерпаны.
    // Выключенные админом, включённые по include_admin_disabled, сюда НЕ входят.
    uint32 enrolled = 2;

    // Пропущено: авто-реинвест уже активен — состояние не тронуто.
    uint32 already_active = 3;

    // Пропущено: выключен администратором (include_admin_disabled = false).
    uint32 admin_disabled_skipped = 4;

    // Включено поверх выключения администратором (include_admin_disabled = true).
    uint32 admin_disabled_enrolled = 5;

    // Эхо запроса: true — ответ является прогнозом, изменений нет.
    bool dry_run = 6;
}
