syntax = "proto3";

package biconom.admin.staking;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "biconom/types/distributor.proto";
import "biconom/types/sort.proto";
import "biconom/types/staking.proto";

// StakingAdminService — админская поверхность стейкинга USDT.
//
// Право на всю поверхность — `ADMIN_STAKING` (`infra::access_control::Permission`):
// чтение, выпуск денег (реализация обязательства по бонусу за достижение,
// переключение авто-режима) и правка настроек модуля.
//
// `ROOT` включает все биты, поэтому под ним доступно всё без отдельной выдачи.
// Право выдаётся узкому кругу: оно позволяет выпустить бонус за ранг 12
// (до $1 000 000) и остановить приём новых депозитов.
service StakingAdminService {
    // ── Чтение ──

    // ВСЁ состояние произвольного дистрибьютора в стейкинге одним запросом:
    // настройки, сводка, депозиты, ранг, бонусы. Тот же тип, что у клиента.
    // Основной метод экрана «открыл пользователя».
    //
    // Денежные поля считаются ровно так же, как в клиентском
    // `StakingService.GetState`: админ видит те же числа, что и сам партнёр, —
    // включая `State.total_earned` и сводку его депозитов `State.summary`
    // (`DepositsSummary`). Единственное отличие — в `State.extra_promo`
    // заполнен автор версии (`created_by_user_id`).
    //
    // Не путать с `GetSummary`: там итоги по ВСЕМУ модулю, а не по партнёру.
    rpc GetState(GetStateRequest) returns (biconom.types.Staking.State);

    // Карточка любого депозита.
    rpc GetDeposit(biconom.types.Staking.Deposit.Id) returns (biconom.types.Staking.Deposit);

    // Журнал стейкинга произвольного дистрибьютора, новые сверху.
    rpc ListEvents(ListEventsRequest) returns (biconom.types.Staking.Event.List);

    // Журнал конкретного депозита, новые сверху.
    rpc ListDepositEvents(ListDepositEventsRequest) returns (biconom.types.Staking.Event.List);

    // Разбор квалификации: почему дистрибьютор не взял следующий ранг.
    // Возвращает вклад, командный объём под следующий ранг и разбивку по веткам
    // с указанием, у какой сработал лимит.
    //
    // Идентификатор — общая модель `Distributor.Id`, поэтому поддержке не нужно
    // сначала искать числовой id: можно спросить сразу по username.
    //
    // Вместе с `legs` приходят справочники `distributors` и `accounts` — карточки
    // лидеров веток с аватаром и контактами, чтобы поддержка видела, кто именно
    // упёрся в лимит, без второго запроса.
    rpc GetRankProgress(biconom.types.Distributor.Id) returns (biconom.types.Staking.RankProgress);

    // Полная конфигурация: захардкоженная экономика (ранги, тиры, циклы) плюс
    // текущие изменяемые настройки. Экономика меняется только пересборкой,
    // настройки — через `UpdateSettings`.
    rpc GetConfig(google.protobuf.Empty) returns (biconom.types.Staking.Config);

    // Сводка по ВСЕМУ модулю, по всем партнёрам сразу (`Staking.Summary`):
    // сколько в депозитах, сколько выплачено доходности по тиру, экстра-прибыли,
    // рефералки и бонусов за достижение, сумма невыплаченных обязательств, статус.
    //
    // Единственный источник сообщения `Summary`; клиентского аналога нет и он
    // не нужен. Цифры ОДНОГО партнёра — это `Staking.State` / `State.summary`
    // (`DepositsSummary`): партнёр получает их клиентским
    // `StakingService.GetState` без прав админа, админ — методом `GetState`
    // этого сервиса.
    rpc GetSummary(google.protobuf.Empty) returns (biconom.types.Staking.Summary);

    // ── Бонусы за достижение рангов ──

    // Обязательства по бонусам за достижение, НОВЫЕ СВЕРХУ, курсорная пагинация.
    // Фильтры комбинируются: по статусу выплаты, по конкретному рангу,
    // по дистрибьютору.
    rpc ListObligations(ListObligationsRequest) returns (biconom.types.Staking.Obligation.List);

    // Одно обязательство по идентификатору.
    rpc GetObligation(biconom.types.Staking.Obligation.Id) returns (biconom.types.Staking.Obligation);

    // Реализовать обязательство: бонус уходит из пула на кошелёк дистрибьютора.
    // Идемпотентно: повторный вызов на уже выплаченном возвращает FailedPrecondition.
    // Массовой реализации нет по решению заказчика — ручная модерация поштучно.
    //
    // Ключа идемпотентности в запросе нет и не нужно: повтор защищён натуральным
    // ключом `(distributor_id, rank)` и флагом `released` — вторая попытка
    // выпустить те же деньги возвращает ошибку, а не выплачивает повторно.
    // Поэтому запрос состоит из одного идентификатора и передаётся им напрямую.
    //
    // Требует ADMIN_STAKING.
    rpc ReleaseObligation(biconom.types.Staking.Obligation.Id) returns (biconom.types.Staking.Obligation);

    // Настройки автовыплаты бонусов за достижение: 12 строк
    // (ранг, сумма бонуса, флаг авто).
    rpc ListRankBonusSettings(google.protobuf.Empty) returns (biconom.types.Staking.RankBonusSetting.List);

    // Включить/выключить автовыплату бонуса за достижение для ОДНОГО ранга.
    //
    // Действует только на БУДУЩИЕ достижения. Уже висящие невыплаченные
    // обязательства автоматически не выплачиваются — их по-прежнему нужно
    // реализовывать вручную. Это защита от того, что одно переключение тумблера
    // разом выпустит все накопленные суммы.
    //
    // Требует ADMIN_STAKING.
    rpc SetRankBonusAutoRelease(SetRankBonusAutoReleaseRequest) returns (biconom.types.Staking.RankBonusSetting);

    // ── Изменяемые настройки модуля ──

    // Обновить настройки. Задаются только те поля, которые нужно изменить;
    // незаданные остаются как есть. Возвращается полное новое состояние.
    //
    // Что можно менять:
    //   * min_deposit               — минимальная сумма входа в депозит;
    //   * default_reinvest_profit   — реинвест прибыли у новых депозитов;
    //   * service_status            — ACTIVE / PAUSED / STOPPED.
    //
    // Изменение действует на БУДУЩИЕ депозиты: у уже открытых ни минимум, ни
    // значение реинвеста не переписываются.
    //
    // `default_reinvest_profit` — единственный источник флага при создании
    // депозита: клиент его в `CreateDeposit` не передаёт.
    //
    // Требует ADMIN_STAKING — это глобальные рычаги, влияющие на деньги и на продажи.
    rpc UpdateSettings(UpdateSettingsRequest) returns (biconom.types.Staking.Settings);

    // ── Депозиты от имени компании (только ROOT) ──

    // Подарить партнёру депозит за счёт компании.
    //
    // Две отдельные группы проводок: сначала подарок на USDT-кошелёк партнёра
    // через кассу (как `WalletCurrencyService.Gift`, карточка `gift` с
    // комментарием), затем обычная покупка депозита с кошелька на ту же сумму.
    // В истории партнёра это две карточки — «подарок» и «вложение».
    //
    // Минимальная сумма, `BLOCK_STAKING` партнёра и статус модуля (`PAUSED`) НЕ
    // проверяются: это действие компании, а не продажа. Сумма должна быть > 0.
    //
    // `marketing_blocked` задаёт `Deposit.marketing_blocked` создаваемого
    // депозита: при true прирост его тела не раздаётся аплайну по реферальной
    // лестнице и не входит в объёмы для рангов.
    //
    // Требует ROOT.
    rpc GrantDeposit(GrantDepositRequest) returns (biconom.types.Staking.Deposit);

    // Установить или снять блокировку маркетинга у ЛЮБОГО депозита.
    //
    // Лестница: уже выплаченные доли не отзываются, новых начислений после
    // блокировки нет. Объёмы для рангов пересчитываются СРАЗУ: вклад депозита
    // (его тело, у закрытого — тело на момент закрытия) снимается с личного
    // вклада партнёра и объёма ветки всех предков при блокировке и возвращается
    // при снятии; снятие запускает пересчёт рангов вверх. Ранг никогда не
    // понижается. Повтор с тем же значением — no-op без события и без движения
    // объёмов.
    //
    // Требует ROOT.
    rpc SetDepositMarketingBlock(SetDepositMarketingBlockRequest) returns (biconom.types.Staking.Deposit);

    // ── Экстра-прибыль (`Staking.ExtraPromo`) ──
    //
    // Акция: депозит, СОЗДАННЫЙ в диапазоне дат акции, на каждой выплате цикла
    // получает сверх дохода по тиру ещё `тело × ставка акции` за счёт компании.
    // Пять методов ниже — управление акциями, все требуют ADMIN_STAKING.
    // Клиентскому приложению они не нужны: партнёр видит акцию в своём
    // `GetState` — `State.extra_promo` (для нового депозита) и
    // `Deposit.extra_rate` (у каждого открытого).
    //
    // ГЛАВНОЕ, ЧТО НУЖНО ЗНАТЬ ПЕРЕД СОЗДАНИЕМ. Диапазон дат ограничивает дату
    // СОЗДАНИЯ депозита, а не период выплат. Депозит, созданный в диапазоне,
    // получает экстру на КАЖДОЙ своей выплате до созревания (до 12 выплат) —
    // в том числе когда диапазон давно закончился. Акция «на октябрь» под 5%
    // означает: каждый депозит, открытый в октябре, получит +5% от тела на всех
    // своих выплатах, пока акция остаётся действующей. Остановить выплаты можно
    // только новой версией акции (`UpdateExtraPromo`: деактивация, другие даты
    // или ставка) — она действует с ближайшей выплаты каждого депозита.
    //
    // Депозит, открытый партнёром через `ReinvestDeposit`, — новый депозит: в
    // акцию он попадает по СВОЕЙ дате создания.
    //
    // Запись акции неизменяема: любая правка создаёт НОВУЮ версию, прежняя
    // уходит в архив. По цепочке версий видно, кто и когда что поменял и какие
    // значения действовали раньше.
    //
    // Это НЕ промо «токен за депозит» (WINZU): та акция включается флагом
    // маркетинга и курсом `promo_winzu_rate` в `UpdateSettings`.

    // Создать акцию: диапазон дат создания депозита и экстра-ставка. Акция
    // сразу действующая.
    //
    // Диапазон не должен пересекаться ни с одной ДЕЙСТВУЮЩЕЙ акцией —
    // FailedPrecondition. `deposit_created_at_lt` обязано быть строго больше
    // `deposit_created_at_ge`, ставка — больше нуля; иначе InvalidArgument.
    // Диапазон может лежать в прошлом: депозиты, открытые в нём, начнут
    // получать экстру со своей ближайшей выплаты, без доплаты за прошедшие циклы.
    //
    // Требует ADMIN_STAKING.
    rpc CreateExtraPromo(CreateExtraPromoRequest) returns (biconom.types.Staking.ExtraPromo);

    // Выпустить НОВУЮ ВЕРСИЮ акции: изменить даты, ставку и/или статус.
    //
    // `id` — верхняя (не архивная) версия; архивную править нельзя —
    // FailedPrecondition, несуществующую — NotFound. Незаданные поля
    // наследуются от заменяемой версии; к заданным применяются те же правила
    // ввода, что в `CreateExtraPromo` (секунды без `nanos`, ставка до "1").
    // Запрос, который ничего не меняет, — InvalidArgument: пустых версий нет.
    //
    // Прежняя версия получает бит `ARCHIVED`, выходит из цепочки действующих и
    // остаётся только в цепочке версий. Новая версия, если она действующая,
    // встаёт в цепочку действующих по своим датам и проходит ту же проверку
    // пересечения, что и при создании. Деактивированная версия в цепочку не
    // встаёт и диапазон не занимает; повторное включение — снова новая версия,
    // и проверка пересечения выполняется заново.
    //
    // Действует на БУДУЩИЕ выплаты уже открытых депозитов: с ближайшей выплаты
    // каждый депозит получает экстру по новой версии (или не получает вовсе,
    // если версия деактивирована либо его дата создания больше не попадает в
    // диапазон). Выплаченное раньше не пересчитывается и не отзывается.
    //
    // Требует ADMIN_STAKING.
    rpc UpdateExtraPromo(UpdateExtraPromoRequest) returns (biconom.types.Staking.ExtraPromo);

    // Одна версия акции по идентификатору, включая архивные.
    //
    // Требует ADMIN_STAKING.
    rpc GetExtraPromo(biconom.types.Staking.ExtraPromo.Id) returns (biconom.types.Staking.ExtraPromo);

    // Актуальные карточки акций — только верхние версии, архивных здесь нет.
    // Порядок: по `deposit_created_at_ge` от поздних к ранним.
    //
    // Сколько по акциям уже выплачено, этот список не показывает: общая сумма
    // экстра-прибыли по модулю — `Summary.total_extra_paid` (`GetSummary`), по
    // партнёру — `State.summary.total_extra_paid` (`GetState`).
    //
    // Требует ADMIN_STAKING.
    rpc ListExtraPromos(ListExtraPromosRequest) returns (biconom.types.Staking.ExtraPromo.List);

    // Цепочка версий акции целиком, от новой к старой. `id` — ЛЮБАЯ версия этой
    // цепочки: первая запись ответа всегда верхняя.
    //
    // Требует ADMIN_STAKING.
    rpc ListExtraPromoVersions(biconom.types.Staking.ExtraPromo.Id) returns (biconom.types.Staking.ExtraPromo.List);
}

message GetStateRequest {
    uint32 distributor_id = 1;
    // true — добавить в `deposits` ещё и закрытые. На `summary` не влияет.
    // Активные и созревшие приходят всегда.
    bool include_closed_deposits = 2;
}

message ListEventsRequest {
    uint32 distributor_id = 1;
    // Курсор: `Event.id` последнего полученного события (exclusive).
    optional uint64 cursor = 2;
    // Направление и лимит. По умолчанию: BACKWARD, 50 записей.
    optional biconom.types.Sort sort = 3;
}

message ListDepositEventsRequest {
    uint32 deposit_id = 1;
    optional uint64 cursor = 2;
    optional biconom.types.Sort sort = 3;
}

message ListObligationsRequest {
    // Фильтр по факту выплаты. Не задан — все.
    optional bool released = 1;
    // Фильтр по конкретному рангу. 0 — все ранги.
    uint32 rank = 2;
    // Фильтр по дистрибьютору. 0 — все.
    uint32 distributor_id = 3;
    // Курсор: `Obligation.id` последнего полученного (exclusive).
    // null — с самого нового. Конец: записей меньше чем `sort.limit`.
    optional uint64 cursor = 4;
    // Направление и лимит. По умолчанию: BACKWARD, 50 записей.
    optional biconom.types.Sort sort = 5;
}

message SetRankBonusAutoReleaseRequest {
    // Ранг 1..12. У рангов 1..3 бонуса нет, настройка неприменима — InvalidArgument.
    uint32 rank = 1;
    bool auto_release = 2;
}

// Частичное обновление настроек: применяются только заданные поля.
message UpdateSettingsRequest {
    // Новая минимальная сумма входа в депозит. Должна быть > 0.
    optional string min_deposit = 1;
    // Новое значение реинвеста прибыли по умолчанию для новых депозитов.
    // ЕДИНСТВЕННЫЙ источник этого флага: клиент при создании его не передаёт.
    optional bool default_reinvest_profit = 2;
    // Новый глобальный статус модуля.
    optional biconom.types.Staking.ServiceStatus.Id service_status = 3;
    // Новый курс промо-акции «токен за депозит»: USDT за 1 WINZU, строкой
    // ("2.50"), > 0. Шаг — цент.
    optional string promo_winzu_rate = 4;
}

message GrantDepositRequest {
    uint32 distributor_id = 1;
    // Сумма в USDT, строкой. Больше нуля; минимум модуля не применяется.
    string amount = 2;
    // Блокировать ли реферальную лестницу с этого депозита.
    bool marketing_blocked = 3;
}

message SetDepositMarketingBlockRequest {
    uint32 deposit_id = 1;
    // Новое значение `Deposit.marketing_blocked`: true — лестница с депозита
    // не раздаётся, false — раздаётся штатно.
    bool marketing_blocked = 2;
}

message CreateExtraPromoRequest {
    // Нижняя граница даты создания депозита — ВКЛЮЧАЕТСЯ.
    //
    // Обе границы обязательны и задаются с точностью до СЕКУНДЫ: `nanos`
    // должен быть 0, `seconds` — от 0 до 4294967295. Иначе InvalidArgument
    // (`STAKING_EXTRA_PROMO_RANGE_INVALID`).
    google.protobuf.Timestamp deposit_created_at_ge = 1;
    // Верхняя граница — НЕ включается. Строго больше `deposit_created_at_ge`.
    google.protobuf.Timestamp deposit_created_at_lt = 2;
    // Экстра-ставка ЗА ОДИН ЦИКЛ (не годовая) — коэффициент строкой, а не
    // процент: 5% → "0.05". Депозит получает `тело × rate` на каждой выплате,
    // то есть до 12 раз за свой срок. Больше нуля и не больше "1" (100% за
    // цикл), шаг — 0.000001 (одна десятитысячная процента): не более 6 знаков
    // после точки, лишние не отбрасываются, а отвергаются. Иначе
    // InvalidArgument (`STAKING_EXTRA_PROMO_RATE_INVALID`).
    string rate = 3;
}

// Новая версия акции: применяются только заданные поля, остальные наследуются
// от заменяемой версии.
message UpdateExtraPromoRequest {
    // Верхняя (не архивная) версия акции, которую заменяет новая.
    uint32 id = 1;
    optional google.protobuf.Timestamp deposit_created_at_ge = 2;
    optional google.protobuf.Timestamp deposit_created_at_lt = 3;
    optional string rate = 4;
    // true — выключить акцию: с ближайшей выплаты депозиты перестают получать
    // по ней экстру. false — включить обратно (диапазон заново проверяется на
    // пересечение с действующими акциями).
    optional bool deactivated = 5;
}

message ListExtraPromosRequest {
    // true — добавить в ответ деактивированные акции (верхние версии).
    // По умолчанию приходят только действующие.
    bool include_deactivated = 1;
}
