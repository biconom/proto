syntax = "proto3";

package biconom.client.staking;

import "google/protobuf/empty.proto";
import "biconom/client/transaction/transaction.proto";
import "biconom/types/distributor.proto";
import "biconom/types/sort.proto";
import "biconom/types/staking.proto";

// StakingService — клиентская поверхность стейкинга USDT.
//
// Дистрибьютор определяется контекстом авторизации, НЕ из запроса: партнёр
// видит и меняет только собственные депозиты.
//
// Все методы требуют Session-токен обычного пользователя.
service StakingService {
    // ВСЁ состояние партнёра в стейкинге одним запросом: настройки, сводка,
    // список депозитов, ранг, бонусы. Основной метод главного экрана.
    //
    // Закрытые депозиты по умолчанию НЕ приходят — их включает флаг в запросе.
    // Сводка при этом всегда по всем депозитам, независимо от флага.
    rpc GetState(GetStateRequest) returns (biconom.types.Staking.State);

    // СТАТИЧНАЯ экономика: таблица 12 рангов, сетка тиров, число и длина циклов.
    // Меняется только пересборкой сервиса — клиент забирает один раз при старте
    // и кэширует.
    //
    // Изменяемые настройки (минимум входа, дефолты реинвеста, статус приёма)
    // сюда тоже входят, но их не нужно опрашивать отдельно: они приходят в
    // каждом `GetState`.
    rpc GetConfig(google.protobuf.Empty) returns (biconom.types.Staking.Config);

    // Карточка одного своего депозита.
    rpc GetDeposit(biconom.types.Staking.Deposit.Id) returns (biconom.types.Staking.Deposit);

    // Создать депозит. Сумма списывается с USDT-кошелька и переводится на новый
    // счёт-леджер депозита. Минимум — `Config.min_deposit` ($100). Ограничения на
    // количество активных депозитов нет.
    //
    // Флаг реинвеста прибыли в запросе НЕ передаётся: он берётся из
    // `Config.settings.default_reinvest_profit` в момент создания. Менять его
    // после создания — `SetAutoReinvestProfit`.
    //
    // В той же группе проводок раздаётся реферальная лестница вверх по спонсорскому
    // дереву от суммы депозита. Отменить созданный депозит нельзя.
    //
    // Запрещено при статусе сервиса PAUSED и STOPPED.
    rpc CreateDeposit(CreateDepositRequest) returns (biconom.types.Staking.Deposit);

    // ЗАБРАТЬ тело созревшего депозита на USDT-кошелёк.
    //
    // Только для депозита в статусе MATURED: активный — FailedPrecondition,
    // уже закрытый — тоже. Депозит переходит в CLOSED, вернуть его в работу
    // нельзя. Частичный вывод не поддерживается — забирается всё тело.
    //
    // Разрешено при ЛЮБОМ статусе сервиса, включая STOPPED: забрать своё тело
    // партнёру нельзя запретить.
    //
    // Возвращает закрытый депозит.
    rpc ClaimDeposit(biconom.types.Staking.Deposit.Id) returns (biconom.types.Staking.Deposit);

    // РЕИНВЕСТИРОВАТЬ тело созревшего депозита — открыть новый депозит на всю
    // сумму тела: новые 12 циклов, новая реферальная раздача вверх по структуре,
    // рост личного вклада на всю сумму.
    //
    // Только для депозита в статусе MATURED. Исходный депозит переходит в CLOSED,
    // новый ссылается на него через `source_deposit_id`. Повторный реинвест того
    // же тела невозможен: на один исходный депозит приходится не больше одного
    // порождённого. Минимальная сумма входа НЕ проверяется — это не новая покупка.
    //
    // Запрещено при статусе сервиса PAUSED и STOPPED: в отличие от `ClaimDeposit`,
    // это решение вложить деньги заново.
    //
    // Возвращает НОВЫЙ депозит.
    rpc ReinvestDeposit(biconom.types.Staking.Deposit.Id) returns (biconom.types.Staking.Deposit);

    // Реинвест ПРИБЫЛИ: направлять выплату дохода в тело этого же депозита.
    //
    // Включение действует НЕМЕДЛЕННО. Отключение отложенное: ближайшая выплата
    // ещё уйдёт в тело, а со следующей доход пойдёт на кошелёк. Заявку на
    // отключение можно отозвать до наступления ближайшей выплаты.
    rpc SetAutoReinvestProfit(SetAutoReinvestProfitRequest) returns (biconom.types.Staking.Deposit);

    // Весь свой журнал стейкинга, новые сверху, курсорная пагинация.
    //
    // Содержит и события по собственным депозитам, и доли реферальной лестницы,
    // пришедшие с депозитов структуры (`Event.ReferralReceived`) — то есть весь
    // заработок партнёра в модуле одной лентой.
    rpc ListEvents(ListEventsRequest) returns (biconom.types.Staking.Event.List);

    // Журнал конкретного своего депозита, новые сверху.
    rpc ListDepositEvents(ListDepositEventsRequest) returns (biconom.types.Staking.Event.List);

    // ФИНАНСОВЫЕ ТРАНЗАКЦИИ партнёра по стейкингу — тот же ответ, что у
    // `TransactionService.History`, но уже отфильтрованный модулем.
    //
    // Отличие от `ListEvents`: журнал — это бизнес-события модуля (в том числе
    // безденежные: созревание, смена флага реинвеста, достижение ранга), а здесь
    // движение денег в том виде, в каком его рисует история кошелька — те же
    // карточки, те же справочники, та же вёрстка.
    //
    // Попадает всё, что стейкинг делал с деньгами партнёра: вложение, доход за
    // цикл, реинвест прибыли, возврат тела, доли реферальной лестницы с
    // депозитов структуры, бонусы за ранги.
    //
    // Фильтрации по всей истории кошелька не происходит: модуль ведёт
    // собственный индекс групп проводок.
    rpc ListTransactions(ListTransactionsRequest) returns (biconom.client.transaction.HistoryResponse);

    // То же, но только по одному своему депозиту: вложение в него, его выплаты,
    // реинвесты его прибыли и возврат его тела.
    //
    // Доли реферальной лестницы сюда НЕ попадают — они приходят с чужих
    // депозитов и к конкретному своему депозиту не относятся. Их место в
    // `ListTransactions`.
    rpc ListDepositTransactions(ListDepositTransactionsRequest) returns (biconom.client.transaction.HistoryResponse);

    // ДЕТАЛЬНЫЙ разбор карьерной лестницы — с разбивкой по веткам первой линии
    // (`legs`): видно, у какой ветки сработал лимит и сколько засчиталось.
    //
    // Отдельный метод, потому что число веток не ограничено: у лидера их могут
    // быть сотни, и в состоянии главного экрана им не место. В `GetState` тот же
    // блок `rank` приходит без `legs`.
    //
    // Вместе с `legs` приходят справочники `distributors` и `accounts` — карточки
    // лидеров веток И самого показываемого партнёра, с аватаром и контактами,
    // чтобы экран не требовал отдельного запроса на каждого.
    //
    // По умолчанию — СВОЙ прогресс. Если идентификатор задан, показывается
    // чужой, но только при праве видеть его профиль: тот же гейт,
    // что у `DistributorService.Get` (свой / команда по спонсорскому дереву /
    // слотовая иерархия, плюс глобальный просмотр у поддержки). Нет права —
    // `PermissionDenied`, несуществующий — `NotFound`.
    // Запрос — общая модель идентификатора: и числовой id (так фронт
    // проваливается из списка веток), и username. Пустой идентификатор означает
    // «свой прогресс», поэтому сообщения-обёртки под метод не заводится — тем же
    // приёмом адресуется депозит в `GetDeposit` / `ClaimDeposit`.
    rpc GetRankProgress(biconom.types.Distributor.Id) returns (biconom.types.Staking.RankProgress);
}

message GetStateRequest {
    // true — добавить в `deposits` ещё и закрытые депозиты (вся история).
    // false / не задано — только активные и созревшие. Созревшие приходят
    // всегда: они ждут действия партнёра.
    //
    // На блок `summary` НЕ влияет: он всегда считается по всем депозитам
    // партнёра, включая закрытые.
    bool include_closed_deposits = 1;
}

message CreateDepositRequest {
    // Сумма в USDT, строкой. Не меньше `Config.settings.min_deposit`.
    //
    // Больше в запросе ничего нет. Флаг реинвеста прибыли берётся сервером из
    // `Config.settings.default_reinvest_profit`: клиент не должен переопределять
    // серверную настройку, иначе значение в карточке депозита разойдётся с тем,
    // что показано в настройках модуля. Реинвеста депозита не существует вовсе —
    // созревший депозит ждёт решения партнёра.
    //
    // Ключа идемпотентности тоже нет: два депозита подряд — законный сценарий,
    // и сервер не отличит его от повторной отправки. Защита от двойного нажатия
    // на клиенте — заблокировать кнопку до ответа.
    string amount = 1;
}

message SetAutoReinvestProfitRequest {
    uint32 deposit_id = 1;
    // true — включить немедленно. false — подать заявку на отключение
    // (применится после ближайшей выплаты).
    bool enabled = 2;
}

message ListTransactionsRequest {
    // Курсор: `Transaction.Group.group_id` последней полученной группы
    // (exclusive) — как в `TransactionService.History`. null — с самой новой.
    optional uint64 cursor = 1;
    // Направление и лимит. По умолчанию: BACKWARD, 50 групп.
    //
    // Лимит считается в ГРУППАХ, а не в проводках: одна операция стейкинга —
    // одна группа, но внутри неё может быть несколько строк (например, доход и
    // тут же его реинвест в тело).
    optional biconom.types.Sort sort = 2;
}

message ListDepositTransactionsRequest {
    uint32 deposit_id = 1;
    // Курсор: `Transaction.Group.group_id` последней полученной группы (exclusive).
    optional uint64 cursor = 2;
    // Направление и лимит. По умолчанию: BACKWARD, 50 групп.
    optional biconom.types.Sort sort = 3;
}

message ListEventsRequest {
    // Курсор: `Event.id` последнего полученного события (exclusive).
    // null — с самого нового. Конец: получено записей меньше чем `sort.limit`.
    optional uint64 cursor = 1;
    // Направление и лимит. По умолчанию: BACKWARD, 50 записей.
    optional biconom.types.Sort sort = 2;
}

message ListDepositEventsRequest {
    uint32 deposit_id = 1;
    // Курсор: `Event.id` последнего полученного события (exclusive).
    optional uint64 cursor = 2;
    // Направление и лимит. По умолчанию: BACKWARD, 50 записей.
    optional biconom.types.Sort sort = 3;
}
