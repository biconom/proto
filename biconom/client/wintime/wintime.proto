syntax = "proto3";

package biconom.client.wintime;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// WintimeService — история статусов WinTime ТЕКУЩЕГО дистрибьютора.
//
// Дистрибьютор определяется контекстом авторизации (Session-токен), НЕ запросом.
// Возвращается ПОЛНАЯ история смен статуса (этапов) без пагинации: смены по
// природе редки — на одного дистрибьютора это десятки записей за всё время.
//
// Назначение — прозрачность начислений: по таймлайну этапов видно, когда и
// почему менялась скорость дохода (активация/истечение пакета дерева,
// бан/разбан), сколько было начислено на каждом этапе и какой накопленный
// баланс был к концу каждого этапа.
service WintimeService {
    // Полная история этапов статуса текущего дистрибьютора в хронологическом
    // порядке (старые → новые), без пагинации, с пересчётом пассивного дохода
    // по этапам.
    rpc GetMaskHistory(google.protobuf.Empty) returns (MaskHistoryResponse);
}

// Полная история этапов статуса дистрибьютора + доходы за личные приглашения
// и общая сумма доходов.
message MaskHistoryResponse {
    // Один этап ЛИЧНОГО ПАССИВНОГО дохода: смена статуса + доход за интервал
    // ДО следующей смены.
    message PassiveItem {
        // Момент смены статуса (бизнес-дата события).
        google.protobuf.Timestamp ts = 1;
        // Аккаунт активен: зарегистрирован и не забанен.
        bool flag_account_active = 2;
        // Активный слот в ПЕРВОМ дереве (Lite).
        bool flag_tree_lite_active = 3;
        // Активный слот во ВТОРОМ дереве (Pro).
        bool flag_tree_pro_active = 4;
        // Множитель скорости пассивного дохода для этого состояния
        // (серверная LUT — фронт не дублирует таблицу множителей).
        uint32 multiplier = 5;
        // Начислено пассивного дохода ЗА этот этап — интервал от этой смены до
        // СЛЕДУЮЩЕЙ (у последнего этапа — до текущего момента): полные минуты
        // интервала × multiplier. Интервал отсчитывается от максимума из
        // {момент смены, момент регистрации, старт пассивного дохода} — та же
        // арифметика, что у фактического начисления.
        uint64 earned = 6;
        // Накопленный пассивный доход к КОНЦУ этого этапа (нарастающий итог
        // по всем этапам; у последнего — накоплено на текущий момент).
        uint64 accumulated = 7;
    }

    // Разовый доход за ЛИЧНОЕ ПРИГЛАШЕНИЕ: бонус WinTime, начисленный в леджер
    // при принятии личника в квоту приглашений спонсора.
    message ReferralItem {
        // Момент начисления бонуса.
        google.protobuf.Timestamp ts = 1;
        // Личник, за которого начислен бонус.
        uint32 child_distributor_id = 2;
        // Начислено WinTime-токенов (базовая ставка × множитель на момент начисления).
        uint64 amount = 3;
        // Накопленный доход за приглашения к ЭТОМУ начислению включительно
        // (нарастающий итог; у последнего — суммарный доход за все приглашения).
        uint64 accumulated = 4;
    }

    // ОБЩИЙ доход со ВСЕХ источников ниже: накопленный пассив (accumulated
    // последнего этапа passive_items) + доход за приглашения (accumulated
    // последнего referral_items). Идёт первым: при добавлении новых видов
    // бонусов списки дописываются после, а итог остаётся на месте.
    uint64 total_income = 1;
    // Этапы ЛИЧНОГО ПАССИВНОГО дохода в хронологическом порядке (старые →
    // новые), ПОЛНЫЙ список без пагинации. Последний элемент — текущее состояние.
    repeated PassiveItem passive_items = 2;
    // Доходы за ЛИЧНЫЕ ПРИГЛАШЕНИЯ в хронологическом порядке (старые → новые),
    // ПОЛНЫЙ список без пагинации. Источник — финансовые транзакции леджера
    // (reason `WinTimeReferral`, сторона получателя).
    repeated ReferralItem referral_items = 3;
}
