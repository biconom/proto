syntax = "proto3";

package biconom.client.wintime_shop;

import "google/protobuf/empty.proto";
import "biconom/types/account.proto";
import "biconom/types/distributor.proto";
import "biconom/types/slot.proto";
import "biconom/types/transaction.proto";
import "biconom/types/wintime_shop.proto";

// WintimeShopService — клиентская витрина WinTime-магазина.
//
// Пользователь просматривает доступные товары и покупает их за WinTime-токены.
// Списание WinTime идёт с дистрибьютора, под которым авторизован пользователь
// (id берётся из контекста авторизации, НЕ из запроса).
//
// Все методы требуют Session-токен обычного пользователя.
service WintimeShopService {
    // Список товаров витрины. По умолчанию — только доступные к покупке
    // (`available == true`). Флаг `include_unavailable` показывает и скрытые
    // (для превью «coming soon»). Каждый элемент обогащён персональными для
    // покупателя полями (`ClientProduct`).
    rpc ListProducts(ListProductsRequest) returns (ClientProduct.List);

    // Получить один товар по идентификатору — числовому id или строковому code
    // (в т.ч. недоступный — для карточки товара). Возвращается обогащённая
    // персональными для покупателя полями карточка (`ClientProduct`).
    rpc GetProduct(biconom.types.WintimeShop.Product.Id) returns (ClientProduct);

    // Купить товар за WinTime-токены (адресация — Product.Id: числовой id или
    // строковый code). Дистрибьютор-покупатель определяется контекстом
    // авторизации. Списывается `price_wintime` (при нехватке — FailedPrecondition).
    // Возвращается результат выдачи (лицензия ИЛИ купон) в зависимости от семейства
    // товара.
    rpc Purchase(biconom.types.WintimeShop.Product.Id) returns (PurchaseResponse);

    // ВСЯ история СВОИХ покупок (новые сверху) — БЕЗ пагинации и фильтров:
    // одним ответом возвращаются все покупки, когда-либо совершённые в
    // магазине. Покупатель — из контекста авторизации. Возвращаются те же
    // визуальные блоки транзакций, что и в `TransactionService.History` —
    // аккаунт видит ОТФИЛЬТРОВАННЫЕ транзакции магазина: сервер по своей
    // истории покупок находит транзакции списания WinTime в леджере, собирает
    // их группы и упаковывает под просматривающий аккаунт. Детали покупки — в
    // entry.details (`WintimeShopPurchaseDetails`: product_id, coupon_code,
    // slot/voucher/tree).
    rpc ListMyPurchases(google.protobuf.Empty) returns (ListMyPurchasesResponse);
}

// ПОЛНАЯ история своих покупок — формат `TransactionService.History`.
message ListMyPurchasesResponse {
    // Блоки транзакций ВСЕХ покупок, новые сверху (одна покупка = одна группа).
    repeated biconom.types.Transaction.Group items = 1;
    // Дедуплицированный список аккаунтов, упомянутых в транзакциях.
    repeated biconom.types.Account accounts = 2;
    // Дедуплицированный список дистрибьюторов, упомянутых в транзакциях.
    repeated biconom.types.Distributor distributors = 3;
    // Дедуплицированный список маркетинговых слотов, упомянутых в транзакциях.
    repeated biconom.types.Slot slots = 4;
}

// Запрос списка товаров.
message ListProductsRequest {
    // Включать ли недоступные к покупке товары (available == false).
    // По умолчанию false — отдаются только доступные.
    bool include_unavailable = 1;
}

// Карточка товара витрины, обогащённая персональными для покупателя полями.
// Базовый каталог (`biconom.types.WintimeShop.Product`) один для всех; поля ниже
// вычисляются под конкретного авторизованного дистрибьютора.
message ClientProduct {
    // Список карточек витрины (клиентский аналог `Product.List`).
    message List {
        repeated ClientProduct items = 1;
    }

    // Базовая карточка товара (общий каталог магазина).
    biconom.types.WintimeShop.Product product = 1;

    // Сколько единиц этого товара покупатель приобрёл ЛИЧНО (по своему
    // distributor_id) за всё время. Для TREE_LICENSE — 0 или 1 (лицензия
    // покупается один раз на дерево).
    uint64 purchased_by_me = 2;

    // Доступен ли товар к покупке ИМЕННО этому покупателю прямо сейчас:
    //   `available` && `stock_remaining > 0` && (для TREE_LICENSE — у покупателя
    //   НИКОГДА не было слота в соответствующем дереве).
    // Для TEXT_COUPON совпадает с (`available` && остаток > 0).
    bool purchasable_by_me = 3;
}

// Ответ на покупку — что получил покупатель.
message PurchaseResponse {
    // Купленный товар (в актуальном состоянии — с уменьшенным остатком).
    biconom.types.WintimeShop.Product product = 1;
    // Результат выдачи: лицензия дерева ИЛИ текстовый купон.
    biconom.types.WintimeShop.Delivery delivery = 2;
    // Финансовая транзакция этой покупки — тот же визуальный блок, что элемент
    // `items` в `ListMyPurchases` / `TransactionService.History`, но ровно одна
    // и без справочников (accounts/distributors/slots). Сумма списания — в
    // entry.amount; детали — в entry.details (`WintimeShopPurchaseDetails`).
    biconom.types.Transaction.Group transaction = 3;
}
