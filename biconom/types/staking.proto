syntax = "proto3";

package biconom.types;

import "google/protobuf/timestamp.proto";
import "biconom/types/distributor.proto";
import "biconom/types/account.proto";

// Переиспользуемые модели стейкинга USDT (`staking`).
//
// Партнёр вкладывает USDT в ДЕПОЗИТ. Депозит приносит 12 выплат дохода, по одной
// за цикл (30 суток на продакшене, см. `Config.cycle_interval_secs`), после чего
// СОЗРЕВАЕТ (`Deposit.Status.MATURED`): выплаты
// прекращаются, но тело НЕ уходит на кошелёк само. Дальше решает партнёр —
// `ClaimDeposit` (забрать на кошелёк) либо `ReinvestDeposit` (переоткрыть всё
// тело новым депозитом). Пока решения нет, тело лежит на счёте депозита и в
// сумме активных депозитов НЕ учитывается: депозит больше не зарабатывает,
// значит и тир держать не должен.
//
// В модуле ДВА независимых процента, и их нельзя путать:
//
//   * ТИР (`Tier`) — сколько партнёр получает СО СВОИХ денег. Ставка выбирается
//     по сумме тел ВСЕХ его активных депозитов в момент начисления и применяется
//     к телу конкретного депозита. Меняется динамически: завершился депозит —
//     сумма упала — ставка следующей выплаты ниже.
//
//   * РАНГ (`Rank`) — сколько партнёр получает С ЧУЖИХ денег. Реферальная
//     лестница: при каждом приросте тела у кого-то в структуре вышестоящие
//     получают разницу между процентом своего ранга и уже выплаченным процентом,
//     до 16% суммарно. Ранг берётся за личный ВКЛАД и командный ОБОРОТ и
//     НИКОГДА не понижается.
//
// Ортогональны полностью: партнёр может иметь ранг 12 (16% с чужих депозитов) и
// одновременно тир 5% (минимальная ставка со своих), если ранг был взят давно
// командным оборотом, а собственных активных депозитов сейчас на $100.
// Поэтому объединить их в одну таблицу нельзя.
//
// Поверх тира может действовать ЭКСТРА-ПРИБЫЛЬ (`ExtraPromo`) — акция с
// диапазоном дат: депозит, СОЗДАННЫЙ в этом диапазоне, на каждой выплате получает
// дополнительный процент от своего тела. Это не третья шкала, а добавка к тиру:
// от суммы депозитов и от ранга она не зависит, только от даты создания депозита.
//
// За достижение ранга положен БОНУС ЗА ДОСТИЖЕНИЕ, который материализуется как
// ОБЯЗАТЕЛЬСТВО (`Obligation`) и выплачивается автоматически либо вручную админом.
//
// Все денежные величины передаются СТРОКАМИ — как балансы в `biconom.types.Ledger`
// (высокая точность, без потери на double).
//
// ─────────────────────────────────────────────────────────────────────────────
// ДЕНЬГИ ПАРТНЁРА: ЧТО ОТКУДА БЕРЁТСЯ И ЧТО НЕЛЬЗЯ СКЛАДЫВАТЬ
// ─────────────────────────────────────────────────────────────────────────────
//
// У партнёра в стейкинге ЧЕТЫРЕ источника заработка, и каждый лежит в своём поле:
//
//   1. доход по ставке тира     — `DepositsSummary.total_income_paid`
//   2. экстра-прибыль (акция)   — `DepositsSummary.total_extra_paid`
//   3. реферальная лестница     — `State.total_referral_received`
//   4. бонусы за ранги          — `State.total_achievement_bonus_received`
//                                 (только уже ВЫПЛАЧЕННЫЕ)
//
// Их сумму сервер отдаёт готовым числом — `State.total_earned`. Клиенту ничего
// складывать не нужно.
//
// Все эти поля партнёр получает ОБЫЧНЫМ КЛИЕНТСКИМ запросом
// `StakingService.GetState` (сообщение `State`; сводка по депозитам — в его поле
// `summary` типа `DepositsSummary`). Прав админа для этого НЕ нужно.
//
// В файле ДВЕ сводки с похожими именами полей — их нельзя путать:
//
//   * `DepositsSummary` — цифры ОДНОГО партнёра. Приходит клиенту в
//     `State.summary`.
//   * `Summary`         — цифры ВСЕГО модуля, по всем партнёрам сразу. Только
//     админский `StakingAdminService.GetSummary`. Клиентское приложение это
//     сообщение не получает никогда.
//
// Поля, которые ПЕРЕСЕКАЮТСЯ, — их нельзя прибавлять друг к другу:
//
//   * `DepositsSummary.total_reinvested` — это ЧАСТЬ суммы (1) + (2), та её
//     часть, что ушла обратно в тела депозитов. Не добавка к заработанному.
//   * `Deposit.body`, `DepositsSummary.active_total`, `matured_total` УЖЕ
//     содержат реинвестированную прибыль. `body + total_income_paid` считает её
//     дважды.
//   * `DepositsSummary.personal_volume` и `invested_total` — не заработок и не
//     баланс: первое — квалификационный объём для рангов, второе — сумма
//     начальных сумм депозитов (см. комментарии у полей).
//   * `Event.IncomeReinvested` — не новый доход, а перемещение уже начисленного
//     (`IncomePaid` + `ExtraIncomePaid` того же цикла) с кошелька в тело.
//
// Чего в `total_earned` НЕТ: WINZU по промо «токен за депозит» (другая валюта),
// подаренный компанией депозит (`GrantDeposit`), ещё не выплаченные бонусы за
// ранги, возврат собственного тела (`ClaimDeposit`).
//
// СТАВКИ тоже передаются строками, но не процентом, а КОЭФФИЦИЕНТОМ:
// 5% → "0.05", 16% → "0.16". На коэффициент умножают напрямую
// (`выплата = тело × rate`), поэтому ни клиент, ни сервер не делят на 100 и не
// гадают о масштабе. Целочисленное «× 10 000» здесь не используется намеренно:
// ошибка на порядок в таком представлении не видна глазом.

// Staking — пространство имён моделей стейкинга.
message Staking {
    // ─────────────────────────────────────────────────────────────────────
    // Депозит
    // ─────────────────────────────────────────────────────────────────────

    // Отдельное вложение партнёра. Имеет собственный счёт-леджер
    // (`Ledger.Owner.staking_deposit_id`), собственное расписание циклов и
    // собственные настройки реинвеста.
    //
    // КТО ПОЛУЧАЕТ. Партнёр — только СВОИ депозиты, клиентским
    // `StakingService`: списком в `State.deposits` (`GetState`) и по одному в
    // ответах `GetDeposit`, `CreateDeposit`, `ClaimDeposit`, `ReinvestDeposit`,
    // `SetAutoReinvestProfit`. Админ — любой депозит через `StakingAdminService`
    // (`GetState`, `GetDeposit`, `GrantDeposit`, `SetDepositMarketingBlock`).
    // Сообщение и расчёт полей в обоих случаях одни и те же.
    //
    // ДЕНЬГИ ДЕПОЗИТА — три разных вопроса, три разных ответа:
    //
    //   сколько денег в депозите          `body`
    //   с какой суммы он начался          `initial_amount`
    //   сколько он заработал за всё время `total_income_paid + total_extra_paid`
    //
    // Связь между ними:
    //
    //   body = initial_amount + (прибыль, ушедшая в тело реинвестом прибыли)
    //
    // Заработанное каждого цикла (доход по тиру и экстра ВМЕСТЕ) уходит целиком
    // либо на кошелёк, либо в тело — по флагу `reinvest_profit_applied`. Поэтому
    // `body − initial_amount` — это ЧАСТЬ заработанного, а не добавка к нему:
    // складывать `body` с `total_income_paid` или `total_extra_paid` нельзя, одни
    // и те же деньги посчитаются дважды.
    //
    // КАРТОЧКА ДЕПОЗИТА — какое поле для какой строки:
    //
    //   «Следующая выплата»   `next_payout_at` (есть только у `ACTIVE`)
    //   «Ожидаемый доход»     `body × State.summary.current_rate`
    //   «Экстра-прибыль»      `body × extra_rate`; при `extra_rate == "0.00"`
    //                         строки нет
    //   «Куда уйдёт выплата»  `reinvest_profit_applied`: true — в тело этого же
    //                         депозита, false — на кошелёк
    //   «Заработано»          `total_income_paid + total_extra_paid`
    //
    // Обе ожидаемые суммы — ПРОГНОЗ, считает клиент; сервер округляет результат
    // ВНИЗ до минимальной единицы валюты. Ставка тира выбирается в момент выплаты
    // по сумме активных депозитов партнёра на тот момент: если до выплаты сумма
    // изменится (открыт новый депозит, созрел другой), изменится и ставка.
    message Deposit {
        // Идентификатор депозита. `oneof` — на случай появления
        // альтернативной адресации, как у `WintimeShop.Product.Id`.
        //
        // Используется как ТИП ЗАПРОСА тех методов, которым больше ничего не
        // нужно (`GetDeposit`, `ClaimDeposit`, `ReinvestDeposit`) — заводить под
        // них пустые сообщения-обёртки незачем. А вот ВНУТРИ запроса, где рядом
        // есть другие поля, депозит адресуется простым `uint32 deposit_id`:
        // вложенная обёртка там только добавляет уровень и проверку «задано ли».
        message Id {
            oneof identifier {
                uint32 id = 1;
            }
        }

        message List {
            repeated Deposit items = 1;
        }

        // Состояние депозита.
        message Status {
            enum Id {
                UNSPECIFIED = 0;
                // Выполнены не все циклы. Тело учитывается в сумме активных
                // депозитов и влияет на тир партнёра.
                ACTIVE = 1;
                // Терминальное состояние: тело ушло с депозита — на кошелёк
                // (`ClaimDeposit`) либо в новый депозит (`ReinvestDeposit`).
                // Счёт депозита обнулён, `body` показывает тело на момент
                // закрытия. Вернуть депозит в работу нельзя.
                CLOSED = 2;
                // СОЗРЕЛ: все 12 циклов выполнены, доход больше не начисляется,
                // но тело ещё лежит на счёте депозита и ждёт решения партнёра —
                // `ClaimDeposit` или `ReinvestDeposit`. Срока на решение нет,
                // депозит может оставаться в этом состоянии сколько угодно.
                //
                // В сумму активных депозитов НЕ входит и на тир не влияет:
                // иначе созревшие депозиты можно было бы не забирать и держать
                // высокую ставку по остальным даром.
                //
                // Значение добавлено ПОСЛЕ `CLOSED` намеренно: хранилище
                // кодирует статус порядковым номером, вставка в середину
                // переинтерпретировала бы уже записанные депозиты.
                MATURED = 3;
            }
        }

        // Откуда взялся депозит.
        message Source {
            enum Id {
                UNSPECIFIED = 0;
                // Партнёр создал вручную, деньги списаны с его кошелька.
                MANUAL = 1;
                // Открыт телом СОЗРЕВШЕГО депозита по команде партнёра
                // (`ReinvestDeposit`). Исходный депозит — в `source_deposit_id`;
                // оно заполнено ТОЛЬКО при этом значении. На один исходный
                // депозит приходится не больше одного такого — повторный
                // реинвест того же тела невозможен.
                BODY_REINVEST = 2;
                // Подарен КОМПАНИЕЙ через админский `GrantDeposit`: тело пришло
                // из орг-пула на кошелёк партнёра и оттуда — в депозит, партнёр
                // своих денег не тратил. В `Deposit` это же выражено полем
                // `granted_by_admin`; оно не меняется за всю жизнь депозита.
                ADMIN_GRANT = 3;
            }
        }

        uint32 id = 1;
        // Владелец депозита.
        uint32 distributor_id = 2;
        // Счёт депозита в леджере. Его баланс И ЕСТЬ тело: отдельного поля с телом
        // в хранилище не существует, поле `body` ниже — материализация для API.
        uint64 ledger_id = 3;
        // Валюта депозита. Сейчас всегда USDT.
        //
        // ГАРАНТИЯ: ВСЕ денежные поля этого депозита (`initial_amount`, `body`,
        // `total_income_paid`, `total_extra_paid`, суммы в его событиях журнала)
        // выражены ИМЕННО в этой валюте. Смешения валют внутри одного депозита
        // не бывает. Исключение одно и оно не про деньги депозита: WINZU по
        // промо «токен за депозит» (`Event.PromoTokenReceived.amount`).
        //
        // Поле присутствует ради явности и на будущее, но программа сейчас
        // моно-валютная: требования рангов и сетка тиров заданы в одной валюте
        // (`Config.currency_id`), поэтому депозит в другой валюте сломал бы
        // расчёт вклада и оборота. Мультивалютность требует отдельного решения.
        uint32 currency_id = 4;

        // ── Деньги ──
        // С какой суммы депозит НАЧАЛСЯ: столько списано с кошелька партнёра на
        // счёт депозита в момент создания. НЕ МЕНЯЕТСЯ никогда — ни от выплат, ни
        // от реинвеста прибыли, ни при закрытии.
        //
        // Чем это НЕ является — «сколько своих денег вложил партнёр»:
        //   * при `source == BODY_REINVEST` это всё тело исходного депозита, то
        //     есть уже вложенные раньше деньги ВМЕСТЕ с реинвестированной
        //     прибылью;
        //   * при `source == ADMIN_GRANT` это сумма подарка компании.
        string initial_amount = 5;
        // ТЕЛО — сколько денег сейчас лежит в депозите. Для активного и
        // созревшего — текущий баланс счёта депозита; для закрытого — тело на
        // момент закрытия (счёт уже обнулён, значение сохранено для истории).
        //
        //   body = initial_amount + прибыль, ушедшая в тело реинвестом прибыли
        //
        // На это тело начисляются доход по тиру и экстра следующего цикла. У
        // созревшего депозита это ровно та сумма, которую партнёр заберёт
        // `ClaimDeposit` или отправит в новый депозит `ReinvestDeposit`.
        //
        // Растёт ТОЛЬКО реинвестом прибыли (доход по тиру вместе с экстрой) и
        // никогда не уменьшается, пока депозит не закрыт. Поэтому «сколько ушло
        // в реинвест» = `body` − `initial_amount`; отдельного поля для этой
        // величины намеренно нет.
        //
        // НЕ СКЛАДЫВАТЬ с `total_income_paid` / `total_extra_paid`:
        // реинвестированная прибыль уже сидит и в теле, и в этих счётчиках.
        string body = 6;
        // Сколько дохода ПО СТАВКЕ ТИРА начислено по этому депозиту за все
        // выплаченные циклы — и та часть, что ушла на кошелёк, и та, что ушла в
        // тело. Только растёт; у закрытого депозита сохраняется. Равно сумме
        // `Event.IncomePaid.amount` этого депозита. НЕ выводится из `body`:
        // доход мог уходить на кошелёк.
        //
        // НЕ входит: экстра-прибыль (она в `total_extra_paid`), реферальные с
        // чужих депозитов, бонусы за ранги, WINZU по промо. Возврат тела доходом
        // не является и сюда тоже не попадает.
        string total_income_paid = 7;

        Status.Id status = 8;
        Source.Id source = 9;

        // ── Цепочка реинвестов: двусвязный список ──
        //
        // Одни и те же деньги могут перекладываться из депозита в депозит
        // сколько угодно раз. Оба конца связи хранятся полями, поэтому цепочку
        // можно пройти в ОБЕ стороны, не перебирая список: назад — по
        // `source_deposit_id`, вперёд — по `reinvested_into_deposit_id`.
        // Отсутствие ссылки всегда 0, а не пустое значение.
        //
        // Поля объявлены по возрастанию номера, поэтому вторая половина связи
        // (`reinvested_into_deposit_id = 21`) стоит ниже, в конце сообщения.

        // НАЗАД: закрытый депозит, тело которого открыло этот.
        // Заполнено только при `source == SOURCE_BODY_REINVEST`, иначе 0.
        uint32 source_deposit_id = 10;

        // ── Расписание ──
        // Тарифный план (снимок на момент создания). Сейчас всегда 1.
        uint32 plan_id = 11;
        // Сколько выплат должно быть всего (снимок). Сейчас 12.
        uint32 cycles_total = 12;
        // Длина цикла в секундах (снимок на момент создания). На продакшене
        // 2592000 = 30 суток, на стейджинге 60 — см. `Config.cycle_interval_secs`.
        uint32 cycle_interval_secs = 13;
        // Сколько выплат уже реализовано. Стартует с 0, не превышает `cycles_total`.
        uint32 cycles_done = 14;

        // Момент создания депозита. Он же — точка отсчёта расписания:
        // первая выплата через `cycle_interval_secs` после него.
        google.protobuf.Timestamp created_at = 15;
        // ПЛАНОВЫЙ момент следующей выплаты. Есть только у `ACTIVE`; у созревшего
        // и закрытого пусто — выплат больше не будет.
        google.protobuf.Timestamp next_payout_at = 16;
        // Плановый момент последней реализованной выплаты. Пусто, если выплат не было.
        google.protobuf.Timestamp last_cycle_at = 17;
        // Момент, когда тело ушло с депозита. Пусто, пока депозит активен ИЛИ
        // созрел, но не забран: созревание само по себе депозит не закрывает.
        google.protobuf.Timestamp closed_at = 18;

        // ── Реинвест прибыли ──
        // Начальное значение берётся из `Settings.default_reinvest_profit` в
        // момент создания депозита; клиент его при создании НЕ задаёт. Менять
        // после создания — `SetAutoReinvestProfit`.
        //
        // Применённое значение — по нему отработает БЛИЖАЙШАЯ выплата:
        // true — всё заработанное за цикл (доход по тиру + экстра) уйдёт в тело
        // этого же депозита, false — останется на кошельке. В обоих случаях
        // сумма одинаково входит в `total_income_paid` / `total_extra_paid`.
        //
        // Исключение: пока админ держит у партнёра персональную блокировку
        // стейкинга, выплата уходит на кошелёк независимо от флага. Сам флаг при
        // этом не меняется, и после снятия блокировки реинвест возобновляется.
        bool reinvest_profit_applied = 19;
        // Что установил партнёр. Отличается от `applied`, когда подана заявка на
        // отключение: ближайшая выплата ещё уйдёт в тело, следующая — на кошелёк.
        bool reinvest_profit_requested = 20;

        // ВПЕРЁД (вторая половина цепочки реинвестов, см. `source_deposit_id`):
        // депозит, открытый телом этого (`ReinvestDeposit`).
        //
        // 0 означает одно из трёх: депозит ещё активен или созрел, тело забрано
        // на кошелёк (`ClaimDeposit`), либо это последнее звено цепочки.
        // Ненулевое значение бывает только у депозита в статусе `CLOSED` и
        // совпадает с `Event.DepositClosed.reinvested_into_deposit_id`.
        //
        // Повторно реинвестировать тело нельзя: на один исходный депозит
        // приходится не больше одного порождённого.
        uint32 reinvested_into_deposit_id = 21;
        // Момент последнего изменения записи.
        google.protobuf.Timestamp updated_at = 22;

        // ── Маркетинг ──
        // true — депозит вне маркетинга: прирост его тела НЕ раздаётся вверх
        // по реферальной лестнице и НЕ входит в объёмы для рангов (личный
        // вклад, объём ветки, командный объём) — ни при создании, ни при
        // реинвесте прибыли. Доходность самому партнёру и тир считаются как
        // обычно. Депозит, открытый телом этого (`ReinvestDeposit`), наследует
        // флаг. Меняется админом (`SetDepositMarketingBlock`) в любом статусе
        // депозита. Уже выплаченные доли лестницы не отзываются, а объёмы
        // пересчитываются сразу: вклад депозита (его тело) снимается с объёмов
        // при блокировке и возвращается при снятии. Ранг никогда не понижается:
        // достигнутый сохраняется, даже если объёма под него больше нет.
        bool marketing_blocked = 23;
        // true — депозит создан админом от имени компании (`GrantDeposit`),
        // партнёр своих денег не вносил. Задаётся при создании и не меняется;
        // то же самое, что `source == ADMIN_GRANT`, оставлено полем ради
        // фильтров и отчётов.
        bool granted_by_admin = 24;

        // ── Экстра-прибыль (`ExtraPromo`) ──
        // Экстра-ставка, которая будет применена на БЛИЖАЙШЕЙ выплате этого
        // депозита, — коэффициент строкой, всегда непустой. Определяется
        // действующей акцией, в диапазон которой попадает `created_at` депозита;
        // `"0.00"` — такой акции сейчас нет либо депозит больше не получает
        // выплат (созрел или закрыт).
        //
        // Значение НЕ зафиксировано в депозите: админ может выпустить новую
        // версию акции (другие даты, процент, статус), и ставка следующей
        // выплаты изменится. Уже выплаченное не пересчитывается.
        //
        // Ожидаемая экстра ближайшей выплаты = `body × extra_rate`, округление
        // вниз. Это отдельная сумма СВЕРХ дохода по тиру (`body ×
        // State.summary.current_rate`): выплата цикла — сумма двух, каждая
        // округляется вниз отдельно.
        string extra_rate = 25;
        // Версия акции, давшая `extra_rate`. 0 — акции нет.
        uint32 extra_promo_id = 26;
        // Сколько экстра-прибыли начислено по этому депозиту за всё время —
        // независимо от того, ушла она на кошелёк или в тело. Только растёт; у
        // закрытого депозита сохраняется. Равно сумме
        // `Event.ExtraIncomePaid.amount` этого депозита.
        //
        // В `total_income_paid` НЕ входит: там только доход по ставке тира. Эти
        // два поля не пересекаются, их сумма — всё, что заработал депозит.
        string total_extra_paid = 27;
    }

    // Сводка по депозитам ОДНОГО партнёра — его личные цифры.
    //
    // КТО ПОЛУЧАЕТ. Сам партнёр, обычным клиентским запросом
    // `StakingService.GetState`: это поле `State.summary`. Прав админа НЕ
    // нужно. Та же модель приходит ещё в двух местах:
    //   * `RankProgress.summary` в ответе `GetRankProgress` (клиент и админ) —
    //     сводка того партнёра, чей прогресс показан;
    //   * `State.summary` в админском `StakingAdminService.GetState` — сводка
    //     партнёра, которого открыл админ.
    //
    // НЕ ПУТАТЬ с сообщением `Summary` (в конце файла): `Summary` — итоги ВСЕГО
    // модуля по всем партнёрам сразу, и получает его только админ
    // (`StakingAdminService.GetSummary`). Одноимённые поля (`total_income_paid`,
    // `total_extra_paid`, `matured_total`) здесь — про ОДНОГО партнёра, там —
    // про всех.
    //
    // НЕ зависит от фильтра списка: если запрошены только активные депозиты,
    // здесь всё равно и активные, и итоги за всё время, включая закрытые
    // депозиты. Это позволяет странице «мои депозиты» обойтись ОДНИМ запросом
    // вместо списка + отдельной сводки.
    //
    // ЧЕГО ЗДЕСЬ НЕТ. Сводка — только про СВОИ депозиты. Реферальные с чужих
    // депозитов и бонусы за ранги лежат уровнем выше, в `State`
    // (`total_referral_received`, `total_achievement_bonus_received`), а всё
    // заработанное одним числом — `State.total_earned`.
    //
    // ЧТО НЕЛЬЗЯ СКЛАДЫВАТЬ:
    //   * `total_reinvested` — ЧАСТЬ суммы `total_income_paid + total_extra_paid`
    //     (та, что ушла в тела), а не добавка к ней;
    //   * `active_total` и `matured_total` уже содержат реинвестированную
    //     прибыль — их нельзя прибавлять к `total_income_paid`,
    //     `total_extra_paid` или `total_reinvested`;
    //   * `invested_total` и `personal_volume` — не заработок и не остаток
    //     денег, с денежными итогами их не складывают.
    // Складывать МОЖНО: `total_income_paid + total_extra_paid` (всё, что
    // заработали свои депозиты) и `active_total + matured_total` (все деньги
    // партнёра, лежащие сейчас в депозитах).
    message DepositsSummary {
        // Валюта программы (сейчас USDT). Все суммы сводки — в ней.
        uint32 currency_id = 1;

        // ── Активные сейчас ──
        // Сколько депозитов в статусе `ACTIVE`.
        uint32 active_count = 2;
        // Сумма тел (`Deposit.body`) депозитов в статусе `ACTIVE` — деньги
        // партнёра, которые работают прямо сейчас. Это и есть база выбора тира.
        //
        // Входит: всё, что лежит в телах активных депозитов, — начальные суммы,
        // реинвестированная прибыль (доход по тиру и экстра), подаренные
        // компанией депозиты, депозиты вне маркетинга.
        // НЕ входит: созревшие депозиты (они в `matured_total`) — они больше не
        // зарабатывают; закрытые депозиты; деньги на кошельке.
        string active_total = 3;
        // Текущая ставка ТИРА за цикл — коэффициент строкой, всегда непустой.
        // Определяется только по `active_total`. Экстра-ставка сюда НЕ входит:
        // она своя у каждого депозита (`Deposit.extra_rate`).
        //
        // Ожидаемый доход ближайшей выплаты депозита = `Deposit.body ×
        // current_rate` (округление вниз). Ставка одна на все активные депозиты
        // партнёра.
        //
        // `"0.00"` означает, что начислять нечего: либо активных депозитов нет
        // (`active_count == 0`), либо их суммы не хватает даже на нижнюю ступень
        // сетки. Второй случай — реальная нулевая ставка, поэтому отличать его
        // пустой строкой было бы неверно. Показывать ли блок ставки, решается по
        // `active_count`, а не по этому полю.
        string current_rate = 4;

        // ── За всё время ──
        // Сколько депозитов было у партнёра за всё время, включая закрытые.
        // Депозит, открытый `ReinvestDeposit`, считается отдельным.
        uint32 total_count = 5;
        // Сумма `Deposit.initial_amount` ВСЕХ депозитов партнёра за всё время,
        // включая закрытые.
        //
        // ВНИМАНИЕ: это НЕ «сколько своих денег внёс партнёр» и не остаток.
        //   * Тело, переложенное `ReinvestDeposit`, входит ПОВТОРНО — как
        //     `initial_amount` нового депозита, причём уже вместе с прибылью,
        //     реинвестированной в старом. Одна и та же $1 000, пройдя через три
        //     депозита подряд, даёт здесь не меньше $3 000.
        //   * Депозит, подаренный компанией (`ADMIN_GRANT`), входит наравне с
        //     купленным, хотя партнёр своих денег не тратил.
        //   * Рост тела ВНУТРИ депозита (реинвест прибыли) сюда не входит — он в
        //     `total_reinvested`.
        // Для показа «сколько у меня сейчас в депозитах» это поле не годится —
        // нужно `active_total` (плюс `matured_total`, если считать и созревшие).
        string invested_total = 6;
        // Личный ВКЛАД для рангов — квалификационный объём, а не деньги
        // партнёра и не заработок. То же число, что `RankProgress.personal_volume`.
        //
        // Растёт на каждый прирост тела депозита: создание (в том числе
        // `ReinvestDeposit` — на всё тело ещё раз) и реинвест прибыли. При
        // созревании и закрытии депозита НЕ уменьшается. Иначе говоря — сумма
        // максимальных тел всех депозитов, участвующих в маркетинге.
        //
        // Депозиты вне маркетинга (`Deposit.marketing_blocked`) сюда не входят,
        // поэтому вклад может быть и МЕНЬШЕ `invested_total`. Пока таких
        // депозитов у партнёра нет, `personal_volume = invested_total +
        // total_reinvested`.
        string personal_volume = 7;

        // ── Доход своих депозитов ──
        // Начислено дохода ПО СТАВКЕ ТИРА за всё время по всем депозитам
        // партнёра, включая закрытые: сумма `Deposit.total_income_paid`. Считается
        // и то, что ушло на кошелёк, и то, что ушло в тела.
        //
        // НЕ входит: экстра-прибыль (она в `total_extra_paid`), реферальные с
        // чужих депозитов, бонусы за ранги.
        string total_income_paid = 8;
        // Сколько из заработанного своими депозитами ушло обратно в их тела
        // реинвестом прибыли: сумма (`Deposit.body − Deposit.initial_amount`) по
        // всем депозитам. В реинвест уходит доход по тиру ВМЕСТЕ с
        // экстра-прибылью, поэтому значение может превышать `total_income_paid`.
        //
        // Это НЕ отдельный доход, а ЧАСТЬ суммы `total_income_paid +
        // total_extra_paid`:
        //
        //   ушло в тела      = total_reinvested
        //   ушло на кошелёк  = total_income_paid + total_extra_paid − total_reinvested
        //
        // Прибавлять его к заработанному нельзя. Реинвест ТЕЛА (`ReinvestDeposit`)
        // сюда не входит — он виден в `invested_total`.
        string total_reinvested = 9;

        // ── Ждут решения ──
        // Сколько депозитов созрело и ждёт `ClaimDeposit` / `ReinvestDeposit`.
        uint32 matured_count = 10;
        // Сумма их тел — столько партнёр может забрать или реинвестировать прямо
        // сейчас. В `active_total` НЕ входит; после `ClaimDeposit` /
        // `ReinvestDeposit` уходит и отсюда.
        string matured_total = 11;

        // ── Экстра-прибыль ──
        // Начислено экстра-прибыли за всё время по всем депозитам партнёра,
        // включая закрытые: сумма `Deposit.total_extra_paid`. Считается и то, что
        // ушло на кошелёк, и то, что ушло в тела.
        //
        // В `total_income_paid` НЕ входит и с ним не пересекается.
        //
        // Одноимённое поле есть в админской `Summary` — там это сумма по ВСЕМ
        // партнёрам. Свою экстру партнёр видит именно ЗДЕСЬ, без прав админа.
        string total_extra_paid = 12;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Экономика: тир (свой доход) и ранг (доход с чужих депозитов)
    // ─────────────────────────────────────────────────────────────────────

    // Ступень СОБСТВЕННОЙ доходности.
    //
    // Ставка выбирается по сумме тел АКТИВНЫХ депозитов партнёра в момент
    // начисления и применяется к телу конкретного депозита. Величина
    // динамическая: она не «достигается» и не фиксируется — пересчитывается на
    // каждой выплате.
    //
    // Это НЕ ранг: тир не даёт ничего с чужих депозитов и может как расти,
    // так и падать.
    message Tier {
        message List {
            repeated Tier items = 1;
        }

        // Нижняя граница суммы активных депозитов, с которой действует ставка.
        string min_active_total = 1;
        // Ставка за один цикл — КОЭФФИЦИЕНТ строкой: 5% → "0.05", 10% → "0.10".
        // Умножается на тело депозита напрямую.
        string rate = 2;
    }

    // Ступень карьерной лестницы — определяет долю партнёра в реферальной
    // раздаче с ЧУЖИХ депозитов и разовый бонус за достижение.
    //
    // Значения захардкожены в сервисе, отдаются read-only.
    message Rank {
        message List {
            repeated Rank items = 1;
        }

        // Номер ранга 1..12.
        uint32 rank = 1;
        // Доля в реферальной лестнице — КОЭФФИЦИЕНТ строкой: 5% → "0.05",
        // 16% → "0.16". Каждый вышестоящий получает
        // `база × (свой коэффициент − уже выплаченный)`.
        string referral_rate = 2;
        // Требуемый личный ВКЛАД: сумма максимальных тел по всем депозитам,
        // когда-либо созданным партнёром, включая закрытые.
        string required_personal_volume = 3;
        // Требуемый командный ОБОРОТ. ОТСУТСТВУЕТ у ранга 1 — он берётся одним
        // личным вкладом. Пустое значение означает «требования нет», а не «ноль».
        optional string required_team_volume = 4;
        // Максимум, который ОДНА ветка первой линии может дать в командный оборот.
        // Задан СУММОЙ, а не долей, чтобы на разных рангах можно было задать разные
        // правила. Сейчас это 34% `required_team_volume`, округлённые ВНИЗ: три
        // максимальные ветки покрывают 102% требования, то есть ранг достижим с
        // запасом. Отсутствует там же, где и оборот.
        optional string max_per_leg = 5;
        // Разовый бонус за достижение ранга. ОТСУТСТВУЕТ у рангов 1..3.
        // Пустое значение означает «бонуса нет», а не «ноль».
        optional string achievement_bonus = 6;
    }

    // ИЗМЕНЯЕМЫЕ настройки модуля.
    //
    // В отличие от таблицы рангов и сетки тиров, которые захардкожены и меняются
    // только пересборкой, эти значения — операционные рычаги: админ меняет их на
    // лету через `UpdateSettings`, изменение персистентно и переживает рестарт.
    message Settings {
        // Минимальная сумма создания депозита. На реинвест прибыли НЕ действует:
        // в тело добавляется любая начисленная сумма, даже меньше минимума. На
        // `ReinvestDeposit` тоже не действует — это не новая продажа.
        string min_deposit = 1;
        // Значение `Deposit.reinvest_profit_*` для НОВЫХ депозитов. ЕДИНСТВЕННЫЙ
        // источник этого флага при создании: клиент его в `CreateDeposit` не
        // передаёт и переопределить не может.
        bool default_reinvest_profit = 2;
        // Глобальный статус модуля: можно ли покупать новые депозиты.
        // Уже открытые депозиты продолжают работать при PAUSED.
        ServiceStatus.Id service_status = 3;
        // Курс промо-акции «токен за депозит»: сколько USDT стоит 1 WINZU,
        // строкой ("2.50"). Бонус = поступление в тело / курс, округление вниз.
        // Сама акция включается битом `staking_promo_winzu` в
        // `MarketingService.SetMarketingFlags`; курс без флага ничего не даёт.
        string promo_winzu_rate = 4;
    }

    // Полная конфигурация модуля: неизменяемая экономика + изменяемые настройки.
    message Config {
        // Валюта программы. Все суммы в `ranks`, `tiers` и `settings.min_deposit`
        // выражены в ней. Сейчас всегда USDT.
        //
        // Программа моно-валютная по построению: вклад и оборот суммируются
        // между депозитами, поэтому депозиты в разных валютах сложить нельзя.
        uint32 currency_id = 1;
        // 12 рангов по возрастанию. Захардкожены, read-only.
        repeated Rank ranks = 2;
        // Сетка тиров по возрастанию порога. Захардкожена, read-only.
        repeated Tier tiers = 3;
        // Число циклов депозита. Захардкожено, read-only.
        uint32 cycles_total = 4;
        // Длина цикла в секундах, read-only. ЗАВИСИТ ОТ ОКРУЖЕНИЯ: на продакшене
        // 2592000 (30 суток), на стейджинге 60 — иначе полный жизненный цикл
        // депозита нельзя было бы проверить руками.
        //
        // Значение — снимок на момент создания депозита: смена окружения или
        // пересборка не меняют расписание уже открытых депозитов. Клиенту не
        // следует зашивать 30 суток константой, надо брать это поле.
        uint32 cycle_interval_secs = 5;
        // Изменяемая админом часть.
        Settings settings = 6;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Экстра-прибыль
    // ─────────────────────────────────────────────────────────────────────

    // Акция «экстра-прибыль»: дополнительная ставка СВЕРХ ставки тира для
    // депозитов, СОЗДАННЫХ в заданный диапазон времени.
    //
    // КТО ПОЛУЧАЕТ. Клиент видит акцию в двух местах клиентского `GetState`:
    // `State.extra_promo` (акция для депозита, который он откроет сейчас) и
    // `Deposit.extra_rate` (ставка каждого уже открытого депозита). Список
    // акций, история версий, создание и правка — только админ
    // (`StakingAdminService`: `CreateExtraPromo`, `UpdateExtraPromo`,
    // `GetExtraPromo`, `ListExtraPromos`, `ListExtraPromoVersions`).
    //
    // Не путать с промо «токен за депозит» (`Settings.promo_winzu_rate`,
    // `Event.PromoTokenReceived`): та акция дарит WINZU за пополнение тела и к
    // экстра-прибыли отношения не имеет.
    //
    // КАК СЧИТАЕТСЯ. На каждой выплате цикла сервис берёт дату создания депозита
    // (`Deposit.created_at`, а не момент выплаты) и ищет действующую акцию, в
    // диапазон которой она попадает. Нашлась — к доходу цикла в той же группе
    // проводок добавляется `тело × rate` (округление вниз) за счёт компании. Не
    // нашлась — экстра-прибыль равна нулю. От ставки тира, суммы депозитов и
    // ранга экстра не зависит; на ставку тира не влияет.
    //
    // ДИАПАЗОН ДАТ ОГРАНИЧИВАЕТ СОЗДАНИЕ ДЕПОЗИТА, А НЕ ПЕРИОД ВЫПЛАТ. Депозит,
    // созданный в диапазоне, получает экстру на КАЖДОЙ своей выплате, пока акция
    // остаётся действующей, — то есть и после того, как диапазон закончился, до
    // самого созревания депозита (до 12 выплат). Акция «на октябрь» — это
    // «депозиты, открытые в октябре, получают экстру весь свой срок», а не
    // «экстра платится в октябре». Прекратить выплаты можно только новой версией
    // акции (деактивация, другие даты или ставка) — с ближайшей выплаты.
    //
    // Депозит, открытый `ReinvestDeposit`, — новый депозит со своей датой
    // создания: в акцию он попадает или не попадает по НЕЙ, а не по дате
    // исходного депозита.
    //
    // Акцию можно завести задним числом: депозиты, открытые в этом диапазоне,
    // начнут получать экстру со своей ближайшей выплаты. За уже прошедшие циклы
    // ничего не доначисляется.
    //
    // ЗАПИСЬ НЕИЗМЕНЯЕМА. Любая правка (даты, процент, статус) — это НОВАЯ запись,
    // то есть новая версия. Одна запись участвует в двух цепочках:
    //
    //   * цепочка ДЕЙСТВУЮЩИХ (`prev_id` / `next_id`) — соседи слева и справа по
    //     времени. В ней только действующие акции (`status == 0`), их диапазоны
    //     не пересекаются;
    //   * цепочка ВЕРСИЙ (`version_prev_id` / `version_next_id`) — прошлая версия
    //     снизу и новая сверху. У архивной записи соседей слева и справа уже
    //     нет, остаётся только эта цепочка.
    //
    // Меняются у существующей записи только ссылки цепочек и бит `ARCHIVED` —
    // значения (даты, процент) не переписываются никогда.
    message ExtraPromo {
        message Id {
            oneof identifier {
                uint32 id = 1;
            }
        }

        message List {
            repeated ExtraPromo items = 1;
        }

        // Биты маски `status`. Значения — степени двойки. Маска `0` — акция
        // ДЕЙСТВУЮЩАЯ: она есть, была или будет в силе по своему диапазону дат.
        // Биты независимы и могут быть взведены оба: деактивированную акцию
        // тоже можно заменить новой версией.
        enum StatusBit {
            // Заглушка proto3, в маске не используется (действующая — это `0`).
            STATUS_BIT_UNSPECIFIED = 0;
            // Бит 0 (значение 1): запись заменена новой версией и ушла вниз по
            // цепочке версий. Новая версия — `version_next_id`.
            STATUS_BIT_ARCHIVED = 1;
            // Бит 1 (значение 2): акция выключена админом. В цепочке действующих
            // её нет, диапазон дат она не занимает, экстра по ней не платится.
            STATUS_BIT_DEACTIVATED = 2;
        }

        // Идентификатор ВЕРСИИ. У каждой правки — свой id.
        uint32 id = 1;
        // Диапазон дат СОЗДАНИЯ ДЕПОЗИТА, на который действует акция.
        // Нижняя граница ВКЛЮЧАЕТСЯ: `Deposit.created_at >= deposit_created_at_ge`.
        google.protobuf.Timestamp deposit_created_at_ge = 2;
        // Верхняя граница НЕ включается: `Deposit.created_at < deposit_created_at_lt`.
        // Всегда строго больше `deposit_created_at_ge`.
        google.protobuf.Timestamp deposit_created_at_lt = 3;
        // Экстра-ставка за один цикл — КОЭФФИЦИЕНТ строкой: 5% → "0.05".
        // Действует поверх ставки тира и применяется к телу депозита: экстра
        // цикла = `Deposit.body × rate`, округление вниз.
        string rate = 4;
        // Битовая маска состояния, биты — `StatusBit`. `0` — действующая.
        uint32 status = 5;

        // ── Цепочка действующих: соседи по времени ──
        // Действующая акция с более РАННИМ диапазоном. 0 — соседа нет либо
        // запись не в цепочке (архивная или деактивированная).
        uint32 prev_id = 6;
        // Действующая акция с более ПОЗДНИМ диапазоном. 0 — аналогично.
        uint32 next_id = 7;

        // ── Цепочка версий ──
        // ПРОШЛАЯ версия, которую заменила эта запись. 0 — это первая версия.
        uint32 version_prev_id = 8;
        // НОВАЯ версия, заменившая эту запись. 0 — версия верхняя (текущая).
        uint32 version_next_id = 9;

        // Админ, создавший эту версию. Заполнено только в админском API,
        // клиенту приходит 0.
        uint32 created_by_user_id = 10;
        // Момент создания версии.
        google.protobuf.Timestamp created_at = 11;
        // Момент последнего изменения ссылок или статуса записи.
        google.protobuf.Timestamp updated_at = 12;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Квалификация
    // ─────────────────────────────────────────────────────────────────────

    // Вклад одной ветки первой линии в командный оборот — с раскрытием, почему
    // засчиталось именно столько. Главный ответ на вопрос «почему не взял ранг».
    message Leg {
        // Лидер ветки — партнёр первой линии.
        uint32 distributor_id = 1;
        // Личный вклад самого лидера.
        string leader_personal_volume = 2;
        // Объём всей ветки: лидер + все его нижестоящие.
        string branch_volume = 3;
        // Лимит на ветку для проверяемого ранга.
        string max_per_leg = 4;
        // Сколько фактически засчитано в командный оборот.
        string counted = 5;
        // true — сработал лимит: ветка дала бы больше, но обрезана.
        bool capped = 6;
        // true — засчитан ВЕСЬ личный вклад лидера, потому что он превышает лимит.
        // В этом случае нижестоящие этой ветки не учитываются вовсе.
        bool leader_exceeds_cap = 7;
        // Лидер ветки САМ активировал хотя бы один депозит.
        //
        // Отдельный флаг, а не `stakers_partners > 0`: лидер может не иметь ни
        // одного депозита, но держать под собой активных партнёров, и наоборот.
        bool personal_activated = 8;
        // Сколько ПАРТНЁРОВ лидера ветки — лично приглашённых им, то есть его
        // первая линия — активировали депозит.
        uint32 stakers_partners = 9;
        // Сколько партнёров в КОМАНДЕ лидера ветки активировали депозит — всё его
        // поддерево, БЕЗ него самого. Складывается с `personal_activated` в общее
        // число активных в ветке.
        //
        // Метрика структуры, а не денег: не зависит ни от лимита на ветку, ни от
        // того, закрыты депозиты или нет.
        uint32 stakers_team = 10;
        // Текущий ранг лидера ветки. 0 — квалификации нет. Та же величина, что
        // `RankProgress.current_rank` у самого лидера; доля лестницы и требования
        // ранга — в `Config.ranks` по этому номеру, вторым источником не дублируются.
        uint32 current_rank = 11;
    }

    // Прогресс партнёра по карьерной лестнице.
    message RankProgress {
        // Факт достижения ОДНОГО ранга. Ранги берутся последовательно и никогда не
        // теряются, поэтому список — это все ранги от 1 до `current_rank`, каждый
        // со своей датой. Нужен экрану «карьера»: 12 карточек, на взятых — галочка
        // и дата.
        message Achievement {
            uint32 rank = 1;
            google.protobuf.Timestamp achieved_at = 2;
            // Обязательство по бонусу за этот ранг. Отсутствует у рангов без бонуса
            // (1..3). По нему разрешается статус выплаты в `State.obligations`.
            optional uint64 obligation_id = 3;
        }

        // Достигнутый ранг. 0 — квалификации нет.
        uint32 current_rank = 1;
        // Пусто при `current_rank == 0`.
        google.protobuf.Timestamp achieved_at = 2;
        // true — достигнут максимальный ранг, блок `next` пуст.
        bool is_max = 3;
        // Требования следующего ранга. Пусто при `is_max`.
        Rank next = 4;

        // Личный вклад. Никогда не уменьшается — даже когда депозит закрыт,
        // а тело выведено на кошелёк.
        string personal_volume = 5;
        // ЗАСЧИТАННЫЙ командный оборот под СЛЕДУЮЩИЙ ранг: лимит на ветку зависит
        // от проверяемого ранга, поэтому величина имеет смысл только в паре с ним.
        // Пусто при `is_max`.
        optional string team_volume = 6;
        // Разбивка командного оборота по веткам первой линии.
        // В `State` ВСЕГДА пусто (размер не ограничен) — см. `GetRankProgress`.
        repeated Leg legs = 7;
        // ПОЛНЫЙ оборот команды БЕЗ применения лимитов на ветку: вклад партнёра
        // плюс объёмы всех веток целиком.
        //
        // Всегда ≥ `team_volume`. Разница — это ровно то, что «срезал» лимит на
        // ветку, и главный ответ на вопрос «у меня в команде $60 000, почему не
        // дали ранг, где нужно $50 000».
        string team_volume_uncapped = 8;
        // Число веток первой линии.
        uint32 legs_count = 9;
        // ИСТОРИЯ достижений: по одной записи на каждый взятый ранг, с датой.
        // Приходит и в `State` — записей максимум 12.
        repeated Achievement achievements = 10;

        // Профили лидеров веток из `legs`: связь `Leg.distributor_id == Distributor.id`.
        //
        // Справочник, а не вложение: у одного лидера может быть несколько веток в
        // будущих раскладках, а карточка партнёра одна. Пусто, когда пуст `legs` —
        // то есть всегда внутри `State`.
        repeated biconom.types.Distributor distributors = 11;

        // Аккаунты-владельцы дистрибьюторов из `distributors`: связь
        // `Distributor.account_id == Account.id`. Внутри аккаунта лежит `User` с
        // аватаром, статусом присутствия и контактами.
        repeated biconom.types.Account accounts = 12;

        // Сколько ПАРТНЁРОВ — лично приглашённых, то есть первая линия — купили
        // хотя бы один депозит.
        //
        // Считается за всё время: созревание депозита, забор тела и закрытие
        // партнёра из счёта не убирают — как и `personal_volume`, величина только
        // растёт. В отличие от `legs`, приходит и в `State`: чтение за O(1).
        uint32 stakers_partners = 13;
        // То же по ВСЕЙ команде — поддерево целиком, без самого партнёра.
        uint32 stakers_team = 14;

        // ЧЕЙ это прогресс. Ключ к карточке в шапке экрана: по нему в
        // `distributors` / `accounts` находятся логин, аватар и контакты.
        //
        // Отдельное поле, а не «первый элемент списка»: клиент может смотреть и
        // чужой прогресс (партнёра из своей команды), и тогда «я» и «показанный»
        // — разные люди. Сами данные не дублируются — они уже лежат в
        // справочниках, а два представления одного факта рано или поздно
        // разъезжаются.
        uint32 distributor_id = 15;

        // Агрегаты по депозитам ПОКАЗЫВАЕМОГО партнёра: сколько внесено за всё
        // время, сколько активно сейчас, сколько начислено дохода, сколько
        // созрело и ждёт решения.
        //
        // Переиспользуется та же модель, что в `State.summary`, — заводить под
        // экран урезанную копию значило бы держать два описания одного факта.
        // Приходит ТОЛЬКО в `GetRankProgress`: внутри `State` эта же сводка уже
        // лежит на верхнем уровне, и дублировать её в блоке ранга незачем.
        DepositsSummary summary = 16;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Бонусы за достижение ранга
    // ─────────────────────────────────────────────────────────────────────

    // Обязательство выплатить бонус за достижение ранга.
    //
    // Создаётся ВСЕГДА, когда у достигнутого ранга есть бонус — и когда выплата
    // автоматическая, и когда ручная. Это даёт единый аудиторский след по всем
    // достижениям, без деления на «авто» и «ручные».
    message Obligation {
        // Идентификатор обязательства. Используется как ТИП ЗАПРОСА методов,
        // которым больше ничего не нужно (`GetObligation`, `ReleaseObligation`) —
        // сообщения-обёртки с единственным полем под них не заводятся.
        message Id {
            oneof identifier {
                uint64 id = 1;
            }
        }

        message List {
            repeated Obligation items = 1;
        }

        uint64 id = 1;
        uint32 distributor_id = 2;
        uint32 rank = 3;
        // Сумма бонуса — СНИМОК на момент достижения. Последующее изменение
        // таблицы рангов не меняет уже созданные обязательства.
        string amount = 4;
        // Валюта бонуса. Совпадает с `Config.currency_id`.
        uint32 currency_id = 5;
        google.protobuf.Timestamp created_at = 6;

        // false — деньги ещё не выплачены, обязательство ждёт решения админа.
        // Отказать в бонусе нельзя: состояний ровно два.
        bool released = 7;
        // Пусто, пока `released == false`.
        google.protobuf.Timestamp released_at = 8;
        // Админ, выпустивший деньги. 0 — выплачено автоматически.
        uint32 released_by_user_id = 9;
        // Группа проводок выплаты. 0 — не выплачено.
        uint64 ledger_group_id = 10;
        google.protobuf.Timestamp updated_at = 11;
    }

    // Настройка автовыплаты бонуса для одного ранга. Единственная динамическая
    // настройка модуля: меняется админом на лету и переживает рестарт.
    message RankBonusSetting {
        message List {
            repeated RankBonusSetting items = 1;
        }

        uint32 rank = 1;
        // Сумма бонуса этого ранга из конфигурации, read-only.
        // Отсутствует у рангов 1..3 — для них настройка неприменима.
        optional string achievement_bonus = 2;
        // true — бонус выплачивается автоматически в момент достижения ранга.
        // false — обязательство ждёт ручной реализации админом.
        bool auto_release = 3;
    }

    // ─────────────────────────────────────────────────────────────────────
    // Журнал событий
    // ─────────────────────────────────────────────────────────────────────

    // Событие журнала стейкинга: всё, что происходит с деньгами партнёра внутри
    // модуля — и по его собственным депозитам, и приход со структуры
    // (`ReferralReceived`).
    //
    // КТО ПОЛУЧАЕТ. Партнёр — свой журнал: `StakingService.ListEvents` и
    // `ListDepositEvents`. Админ — журнал любого партнёра теми же методами
    // `StakingAdminService`.
    //
    // КАКИЕ СОБЫТИЯ — ЗАРАБОТОК. В `State.total_earned` входят суммы ровно
    // четырёх событий, каждое в своё слагаемое:
    //
    //   `IncomePaid.amount`        → `DepositsSummary.total_income_paid`
    //   `ExtraIncomePaid.amount`   → `DepositsSummary.total_extra_paid`
    //   `ReferralReceived.amount`  → `State.total_referral_received`
    //   `RankBonusReleased.amount` → `State.total_achievement_bonus_received`
    //
    // Остальные события заработком НЕ являются, их суммы к заработанному не
    // прибавляют: `DepositOpened`, `DepositMatured`, `DepositClosed` и
    // `IncomeReinvested` — движение собственных денег партнёра между кошельком
    // и депозитом; `DepositGranted` — подарок компании; `PromoTokenReceived` —
    // WINZU, другая валюта; `RankAchieved` денег не двигает.
    message Event {
        message List {
            repeated Event items = 1;
        }

        // Создан депозит: деньги ушли с кошелька партнёра на счёт депозита.
        // Не доход.
        message DepositOpened {
            // Начальная сумма депозита — `Deposit.initial_amount`.
            string amount = 1;
            Deposit.Source.Id source = 2;
            // Закрытый депозит, тело которого открыло этот. 0 — создан вручную.
            uint32 source_deposit_id = 3;
        }

        // Начислен доход ПО СТАВКЕ ТИРА за цикл — деньги компании пришли на
        // кошелёк партнёра. Самодостаточно для перепроверки:
        //   tier(active_deposits_total) == rate
        //   body_at_payout × rate           == amount   (округление вниз)
        //
        // Экстра-прибыль того же цикла сюда НЕ входит — она приходит отдельным
        // событием `ExtraIncomePaid` в той же группе проводок. Если по депозиту
        // включён реинвест прибыли, следом в той же группе идёт
        // `IncomeReinvested`: начисленное уходит с кошелька в тело.
        //
        // Если доход цикла равен нулю (ставка тира `"0.00"`), события нет —
        // цикл при этом всё равно засчитан в `Deposit.cycles_done`.
        message IncomePaid {
            // Номер цикла, 1..cycles_total.
            uint32 payout_seq = 1;
            // Начисленный доход по тиру. Сумма этого поля по всем `IncomePaid`
            // депозита = `Deposit.total_income_paid`.
            string amount = 2;
            // Применённая ставка тира — коэффициент строкой ("0.07").
            string rate = 3;
            // ПОЧЕМУ такая ставка: сумма активных депозитов партнёра на момент
            // начисления — то значение, по которому выбран тир.
            string active_deposits_total = 4;
            // База начисления: тело этого депозита на момент выплаты.
            string body_at_payout = 5;
            // true — это последняя выплата: депозит после неё СОЗРЕЛ. Тело при
            // этом никуда не двигается, см. событие `DepositMatured`.
            bool is_final = 6;
        }

        // Реинвест прибыли: заработанное за цикл ушло с кошелька в тело того же
        // депозита.
        //
        // ЭТО НЕ НОВЫЙ ДОХОД. Событие перемещает деньги, уже начисленные
        // событиями `IncomePaid` и `ExtraIncomePaid` того же цикла (тот же
        // `payout_seq`, та же группа проводок). Прибавлять `amount` к их суммам
        // нельзя — получится двойной счёт. В `State.total_earned` событие не
        // участвует.
        //
        // Пишется только когда выплата действительно ушла в тело
        // (`Deposit.reinvest_profit_applied`); иначе деньги остаются на кошельке
        // и события нет.
        message IncomeReinvested {
            uint32 payout_seq = 1;
            // Сколько ушло в тело: доход цикла ВМЕСТЕ с экстра-прибылью, если
            // она была (`IncomePaid.amount` + `ExtraIncomePaid.amount`). Всегда
            // вся сумма цикла целиком, частичного реинвеста нет. Сумма этого
            // поля по депозиту = `Deposit.body − Deposit.initial_amount`.
            string amount = 2;
            // Тело после прибавления.
            string body_after = 3;
        }

        // Переключение реинвеста прибыли — партнёром или системой.
        message AutoReinvestChanged {
            // Кто инициировал изменение.
            message Actor {
                enum Id {
                    UNSPECIFIED = 0;
                    // Партнёр выполнил действие.
                    USER = 1;
                    // Система применила отложенное отключение в момент выплаты.
                    SYSTEM = 2;
                }
            }
            Actor.Id actor = 1;
            // Что хочет партнёр на этот момент.
            bool requested = 2;
            // Что применено на этот момент. `requested == false` при
            // `applied == true` означает «отключится после ближайшей выплаты,
            // она ещё уйдёт в тело».
            bool applied = 3;
        }

        // Депозит СОЗРЕЛ: 12 циклов выполнены, доход больше не начисляется.
        // Тело осталось на счёте депозита и ждёт решения партнёра. Денег событие
        // не двигает.
        message DepositMatured {
            // Тело на момент созревания — столько можно забрать или
            // реинвестировать.
            string body = 1;
        }

        // Тело ушло с депозита по решению партнёра, депозит закрыт. Это возврат
        // СВОИХ денег (вложенное плюс реинвестированная прибыль, которая уже
        // учтена как доход раньше), а не новый доход.
        message DepositClosed {
            // Сколько ушло с депозита — `Deposit.body` на момент закрытия.
            string body = 1;
            // Новый депозит, открытый телом этого (`ReinvestDeposit`).
            // 0 — тело забрано на кошелёк (`ClaimDeposit`).
            uint32 reinvested_into_deposit_id = 2;
        }

        // Получена доля реферальной лестницы с депозита НИЖЕСТОЯЩЕГО партнёра.
        //
        // Единственное событие журнала, которое приходит не от своего депозита,
        // а от чужого: `Event.deposit_id` у него всегда 0, а депозит-источник
        // лежит внутри. Благодаря ему экран стейкинга показывает и свои
        // депозиты, и заработок со структуры одной лентой.
        message ReferralReceived {
            // Партнёр, чьё вложение породило начисление.
            uint32 source_distributor_id = 1;
            // Его депозит: только что созданный либо тот, в тело которого ушёл
            // реинвест прибыли.
            uint32 source_deposit_id = 2;
            // База начисления — прирост тела у источника.
            string base_amount = 3;
            // Сколько получено — зачислено на кошелёк партнёра. Сумма этого поля
            // по всем `ReferralReceived` = `State.total_referral_received`
            // (включая «токены упущенной выгоды», см. `lost_profit`).
            string amount = 4;
            // Фактическая ставка начисления — КОЭФФИЦИЕНТ строкой. Это разница
            // между процентом своего ранга и тем, что уже забрали нижестоящие
            // звенья цепочки, а НЕ процент ранга: партнёр ранга 12 получает свои
            // 16% целиком только когда под ним никого с рангом нет.
            string rate = 5;
            // Глубина: 1 — прямой личник.
            uint32 depth = 6;
            // НЕДОЗАРАБОТОК: сколько партнёр ЗАРАБОТАЛ БЫ с этого же начисления,
            // будь он на максимальном ранге (16%), сверх того, что заработал.
            //
            // Считается от той же базы и от того же, что уже причиталось
            // нижестоящим звеньям, поэтому это потолок КОНКРЕТНО ЭТОГО
            // начисления, а не абстрактные «16% от базы». Ноль означает «взял
            // всё возможное»: либо максимальный ранг, либо нижестоящие уже
            // выбрали лимит.
            //
            // Вычитается заработанное ЛЕСТНИЦЕЙ, а не всё зачисленное. Разница
            // видна на «токене упущенной выгоды»: сквозной предок, которому не
            // причиталось ничего, получает `amount` в одну минимальную единицу
            // валюты, а `lost_profit` показывает весь упущенный потолок целиком.
            // Поэтому `amount + lost_profit` потолку больше не равно — оно
            // превышает его ровно на этот токен.
            //
            // Величина справочная: этих денег не существует, они не начислены
            // никому — это мотивационный показатель «сколько даст рост ранга».
            string lost_profit = 7;
        }

        // Бонус за достижение ранга ВЫПЛАЧЕН — автоматически либо админом.
        //
        // `RankAchieved` фиксирует только факт достижения и денег не двигает:
        // между достижением и выплатой могут пройти недели ручной модерации.
        // Это событие — момент прихода денег.
        message RankBonusReleased {
            uint32 rank = 1;
            // Выплаченный бонус. Сумма этого поля по всем событиям =
            // `State.total_achievement_bonus_received`.
            string amount = 2;
            // Обязательство, по которому выплачено.
            uint64 obligation_id = 3;
        }

        // Достигнут новый ранг.
        message RankAchieved {
            uint32 rank = 1;
            // Бонус за достижение. Отсутствует у рангов 1..3.
            optional string achievement_bonus = 2;
            // Обязательство по бонусу. Отсутствует, если бонуса нет.
            // Текущий статус выплаты разрешается через список обязательств.
            optional uint64 obligation_id = 3;
        }

        // Админ переключил блокировку маркетинга у депозита. Денег не двигает.
        message MarketingBlockChanged {
            // Новое значение `Deposit.marketing_blocked`.
            bool marketing_blocked = 1;
        }

        // Депозит подарен компанией (`GrantDeposit`). Событие несёт группу
        // проводок ПОДАРКА (компания → кошелёк партнёра); группа покупки депозита
        // с кошелька — у соседнего `DepositOpened`.
        //
        // Подарок — не заработок стейкинга: в `State.total_earned` он не входит.
        // В `DepositsSummary.invested_total` и `active_total` подаренный депозит
        // входит как обычный.
        message DepositGranted {
            // Сумма подарка = `Deposit.initial_amount` подаренного депозита.
            string amount = 1;
            // С каким значением блокировки маркетинга депозит создан.
            bool marketing_blocked = 2;
        }

        // Промо-акция «токен за депозит»: за поступление в тело депозита
        // подарен WINZU. Несёт группу проводок бонуса (орг-пул → WINZU-кошелёк);
        // группа самого поступления — у соседнего `DepositOpened` /
        // `IncomeReinvested`. Ретро-начисление миграцией — тоже это событие.
        //
        // Единственное событие журнала с суммой НЕ в валюте программы. Ни в одно
        // долларовое поле (`total_income_paid`, `total_extra_paid`,
        // `State.total_earned`) подаренный WINZU не входит.
        message PromoTokenReceived {
            // База — сумма поступления в USDT.
            string base_amount = 1;
            // Подаренный WINZU — в WINZU, а не в USDT.
            string amount = 2;
            // Применённый курс — USDT за 1 WINZU, строкой ("2.50").
            string rate = 3;
            // 0 — за открытие депозита (или ретро по всему телу),
            // N — за реинвест прибыли цикла N.
            uint32 accrual_seq = 4;
        }

        // Начислена ЭКСТРА-ПРИБЫЛЬ за цикл (`ExtraPromo`) — деньги компании
        // пришли на кошелёк партнёра СВЕРХ дохода по тиру. Приходит в той же
        // группе проводок, что и `IncomePaid` этого цикла; если доход по тиру в
        // этом цикле нулевой, `ExtraIncomePaid` — единственное денежное событие
        // цикла. Самодостаточно для перепроверки:
        // `body_at_payout × rate == amount` (округление вниз).
        //
        // В `IncomePaid.amount` эта сумма НЕ входит. При включённом реинвесте
        // прибыли она уходит в тело вместе с доходом — одним `IncomeReinvested`.
        message ExtraIncomePaid {
            // Номер цикла, 1..cycles_total.
            uint32 payout_seq = 1;
            // Начисленная экстра-прибыль. Сумма этого поля по всем
            // `ExtraIncomePaid` депозита = `Deposit.total_extra_paid`.
            string amount = 2;
            // Применённая экстра-ставка — коэффициент строкой ("0.05").
            string rate = 3;
            // База начисления: тело этого депозита на момент выплаты.
            string body_at_payout = 4;
            // Версия акции, по которой начислено. Ставка сохранена в событии:
            // последующие версии акции уже выплаченное не меняют.
            uint32 extra_promo_id = 5;
        }

        // Глобальный монотонный идентификатор (хронология по всей системе).
        uint64 id = 1;
        // Порядковый номер события В РАМКАХ ПАРТНЁРА: 1, 2, 3 …
        uint32 seq = 2;
        // СВОЙ депозит, к которому относится событие. 0 — событие не привязано к
        // своему депозиту: достижение ранга (`RankAchieved`) или доля с чужого
        // вложения (`ReferralReceived`, там депозит-источник лежит внутри).
        uint32 deposit_id = 3;
        // БИЗНЕС-время события. Для выплат — ПЛАНОВЫЙ момент цикла, а не момент
        // фактической обработки: при догоне после простоя сервиса эти моменты
        // расходятся, и в истории должен стоять плановый.
        google.protobuf.Timestamp ts = 4;
        // Группа проводок леджера, породившая событие. 0 — событие без денег.
        uint64 ledger_group_id = 5;

        oneof data {
            DepositOpened deposit_opened = 10;
            IncomePaid income_paid = 11;
            IncomeReinvested income_reinvested = 12;
            AutoReinvestChanged auto_reinvest_changed = 13;
            DepositClosed deposit_closed = 14;
            RankAchieved rank_achieved = 15;
            DepositMatured deposit_matured = 16;
            ReferralReceived referral_received = 17;
            RankBonusReleased rank_bonus_released = 18;
            MarketingBlockChanged marketing_block_changed = 19;
            DepositGranted deposit_granted = 20;
            PromoTokenReceived promo_token_received = 21;
            ExtraIncomePaid extra_income_paid = 22;
        }
    }

    // ─────────────────────────────────────────────────────────────────────
    // Сводки
    // ─────────────────────────────────────────────────────────────────────

    // ПОЛНОЕ состояние партнёра в стейкинге — всё, что нужно главному экрану,
    // одним запросом: настройки, сводка, список депозитов, ранг, бонусы.
    //
    // КТО ПОЛУЧАЕТ. Партнёр — своё состояние, клиентским
    // `StakingService.GetState`. Прав админа не нужно: это обычный клиентский
    // метод под сессией партнёра (право `STAKING_USE`, как у всех методов
    // клиентского стейкинга). Админ получает то же сообщение по любому партнёру
    // через `StakingAdminService.GetState`; расчёт всех денежных полей одинаков.
    //
    // ── ГЛАВНЫЙ ЭКРАН: какое поле для какого элемента ──
    //
    //   Плитка «Текущий депозит»     `summary.active_total` — сумма тел
    //                                работающих (активных) депозитов. Созревшие
    //                                депозиты, ждущие решения, сюда НЕ входят —
    //                                они в `summary.matured_total`. Все деньги
    //                                партнёра в депозитах = сумма этих двух
    //                                полей (они не пересекаются).
    //   Плитка «Заработано»          `total_earned` — готовое число. На клиенте
    //                                НИЧЕГО не складывать.
    //   Плитка «Текущая доходность»  `summary.current_rate` — ставка тира за
    //                                цикл. До следующей ступени не хватает
    //                                `to_next_tier`, её ставка — `next_tier_rate`.
    //   Плитка ранга                 `rank.current_rank`. Процент лестницы и
    //                                требования — строка `Config.ranks` с этим
    //                                номером; следующий ранг — `rank.next`;
    //                                прогресс к нему — `rank.personal_volume` и
    //                                `rank.team_volume`.
    //   Карточка депозита            элемент `deposits[]`:
    //     следующая выплата          `next_payout_at`
    //     ожидаемый доход            `body × summary.current_rate`
    //     экстра-прибыль             `body × extra_rate`; при `"0.00"` строки нет
    //   Диалог нового депозита       строка «Extra profit» — `extra_promo.rate`;
    //                                нет `extra_promo` — строки нет. Минимальная
    //                                сумма — `settings.min_deposit`.
    //
    // Произведения `body × ставка` считает клиент; сервер округляет результат
    // вниз до минимальной единицы валюты. Ставки — коэффициенты (`"0.07"` = 7%),
    // умножаются напрямую.
    //
    // Чего здесь НЕТ и почему:
    //   * таблица рангов и сетка тиров — статичны, меняются только пересборкой.
    //     Клиент забирает их один раз через `GetConfig` и кэширует; гонять
    //     18 записей в каждом опросе состояния расточительно;
    //   * `rank.legs` — разбивка по веткам первой линии НЕ ограничена по размеру
    //     (у лидера их могут быть сотни). В состоянии блок `rank` приходит БЕЗ
    //     `legs`; детальный разбор — отдельным `GetRankProgress`.
    message State {
        // Изменяемые настройки модуля. В состоянии, а не в `Config`, потому что
        // меняются на лету и напрямую влияют на экран: по `service_status` клиент
        // решает, показывать ли кнопку покупки, по `min_deposit` — валидировать
        // форму, по дефолтам реинвеста — предзаполнить переключатели.
        Settings settings = 1;

        // Сводка по ВСЕМ депозитам этого партнёра (`DepositsSummary`) — не
        // зависит от фильтра `deposits`. Это личные цифры партнёра, приходят
        // клиенту всегда. Не путать с админской `Summary` по всему модулю.
        DepositsSummary summary = 2;

        // Депозиты. Активные и созревшие приходят всегда; закрытые — только если
        // запрошены флагом. Новые сверху.
        repeated Deposit deposits = 3;

        // Прогресс по карьерной лестнице. Поле `legs` здесь ВСЕГДА пустое —
        // см. примечание выше.
        RankProgress rank = 4;

        // Сколько `summary.active_total` не хватает до следующей ступени сетки
        // тиров. Отсутствует ТОЛЬКО когда тир уже максимальный.
        //
        // Если активных депозитов нет или их сумма ниже первой ступени, поле
        // ЕСТЬ: это расстояние до первой ступени (у партнёра без депозитов —
        // её порог целиком, сейчас $100).
        optional string to_next_tier = 5;
        // Ставка следующей ступени — коэффициент строкой. Присутствует и
        // отсутствует вместе с `to_next_tier`.
        optional string next_tier_rate = 6;

        // Получено по реферальной лестнице за всё время — с приростов тел ЧУЖИХ
        // депозитов (нижестоящих партнёров): сумма `Event.ReferralReceived.amount`.
        // Деньги зачислялись на кошелёк партнёра в момент начисления.
        //
        // Входят и «токены упущенной выгоды» — начисления в одну минимальную
        // единицу валюты (0.000001 USDT) сквозному предку, которому по лестнице
        // не причиталось ничего: это настоящие деньги на кошельке. Свои депозиты
        // партнёра сюда ничего не дают.
        //
        // Слагаемое `total_earned`.
        string total_referral_received = 7;
        // Получено бонусов за достижение рангов за всё время — только уже
        // ВЫПЛАЧЕННЫЕ: сумма `obligations[].amount`, где `released == true`.
        // Достигнутый ранг, бонус за который ещё ждёт выплаты, сюда НЕ входит —
        // он виден в `obligations` с `released == false`.
        //
        // Слагаемое `total_earned`.
        string total_achievement_bonus_received = 8;

        // Бонусы за достижение рангов, включая ещё не выплаченные.
        // Всегда целиком: максимум 9 записей за всю жизнь аккаунта.
        repeated Obligation obligations = 9;

        // ТЕКУЩАЯ акция экстра-прибыли: действующая акция, в диапазон которой
        // попадает момент запроса, — то есть экстра-ставка депозита, который
        // партнёр откроет прямо сейчас. Отсутствует, если такой акции нет.
        //
        // Для уже открытых депозитов смотреть не сюда, а в `Deposit.extra_rate`:
        // у них ставка определяется их собственной датой создания.
        optional ExtraPromo extra_promo = 10;

        // ВСЕГО ЗАРАБОТАНО партнёром в стейкинге за всё время — одно число для
        // плитки «Заработано». Считает сервер, клиенту складывать ничего не надо:
        //
        //   summary.total_income_paid          — доход своих депозитов по тиру
        // + summary.total_extra_paid           — экстра-прибыль своих депозитов
        // + total_referral_received            — реферальные с чужих депозитов
        // + total_achievement_bonus_received   — ВЫПЛАЧЕННЫЕ бонусы за ранги
        // = total_earned
        //
        // Равенство точное, до минимальной единицы валюты. Считается по ВСЕМ
        // депозитам партнёра, включая закрытые, и не зависит от флага
        // `include_closed_deposits`. Валюта — валюта программы (USDT). Число
        // только растёт.
        //
        // Каждый доллар входит ровно один раз:
        //   * реинвест прибыли дохода не создаёт — сумма уже учтена как доход
        //     или экстра, поэтому `summary.total_reinvested` сюда НЕ прибавляется;
        //   * реинвест тела и возврат тела (`ReinvestDeposit`, `ClaimDeposit`) —
        //     движение своих денег, число не меняют;
        //   * бонус за ранг входит только после выплаты — висящее обязательство
        //     ещё не доход;
        //   * подаренный компанией депозит (`GrantDeposit`) — не доход стейкинга;
        //     доход, который он потом приносит, входит как обычно.
        //
        // WINZU по промо-акции «токен за депозит» сюда не входит: это другая
        // валюта, а все слагаемые здесь — в валюте программы.
        //
        // Это «сколько заработано», а не «сколько сейчас есть»: заработанное
        // могло уйти в тела депозитов реинвестом или быть потрачено с кошелька.
        // Остаток денег — это `summary.active_total` + `summary.matured_total`
        // (в депозитах) и баланс кошелька (в кошельковом API).
        string total_earned = 11;
    }

    // Глобальный статус модуля.
    message ServiceStatus {
        enum Id {
            UNSPECIFIED = 0;
            // Штатная работа.
            ACTIVE = 1;
            // Ручное создание депозитов запрещено. Выплаты и реинвест прибыли
            // продолжают работать — это исполнение уже принятых обязательств.
            //
            // `ReinvestDeposit` при этом статусе ЗАПРЕЩЁН: переоткрыть тело
            // новым депозитом — осознанное решение партнёра, то есть новая
            // продажа. `ClaimDeposit` разрешён всегда, при любом статусе:
            // забрать своё тело партнёру нельзя запретить.
            PAUSED = 2;
            // Всё заморожено. Плановые моменты выплат накапливаются и догоняются
            // после возврата в ACTIVE.
            STOPPED = 3;
        }
    }

    // Сводка по ВСЕМУ МОДУЛЮ — деньги всех партнёров сразу.
    //
    // КТО ПОЛУЧАЕТ. ТОЛЬКО админ: единственный источник —
    // `StakingAdminService.GetSummary`. Клиентское приложение это сообщение не
    // получает никогда, и партнёру оно не нужно.
    //
    // НЕ ПУТАТЬ с `DepositsSummary`. Свои цифры партнёр получает обычным
    // клиентским `StakingService.GetState`: сводка по своим депозитам — в
    // `State.summary` (`DepositsSummary`), всё заработанное — в
    // `State.total_earned`. Одноимённые поля двух сообщений (`total_income_paid`,
    // `total_extra_paid`, `matured_total`) различаются охватом: здесь — сумма по
    // всем партнёрам, там — один партнёр. То, что поле есть в `Summary`, НЕ
    // означает, что клиенту нужны права админа, чтобы увидеть своё значение.
    //
    // ОТКУДА ЧИСЛА. Четыре поля «выплачено» — сколько раздал соответствующий
    // пул компании за всё время (читается из баланса пула). Суммы и счётчики
    // депозитов считаются обходом таблицы депозитов на каждый запрос.
    //
    // Всего выплачено партнёрам = `total_income_paid` + `total_extra_paid` +
    // `total_referral_paid` + `total_achievement_bonus_paid`. Эти четыре поля не
    // пересекаются. Сумма `State.total_earned` по всем партнёрам больше этого
    // итога на «токены упущенной выгоды» (см. `total_referral_paid`).
    //
    // Чего в сводке НЕТ: подаренных компанией депозитов (`GrantDeposit`), WINZU
    // по промо «токен за депозит» и токенов упущенной выгоды.
    message Summary {
        // Валюта программы (сейчас USDT). Все суммы сводки — в ней.
        uint32 currency_id = 1;
        // Сумма тел, которые сейчас держит программа: активные ПЛЮС созревшие,
        // но не забранные депозиты всех партнёров. Это обязательства перед
        // партнёрами. Закрытые депозиты не входят. Включает реинвестированную
        // прибыль и подаренные депозиты.
        string total_in_deposits = 2;
        // Сколько депозитов в статусе `ACTIVE`.
        uint32 deposits_active = 3;
        // Сколько депозитов создано за всё время, включая созревшие и закрытые.
        uint32 deposits_total = 4;
        // Выплачено дохода ПО СТАВКЕ ТИРА всем партнёрам за всё время (модуль
        // баланса пула COMPANY STAKING). Экстра-прибыль НЕ входит — она в
        // `total_extra_paid`. У партнёра те же деньги видны как
        // `DepositsSummary.total_income_paid`.
        string total_income_paid = 5;
        // Выплачено долей реферальной лестницы всем партнёрам (модуль баланса
        // пула COMPANY REF).
        //
        // «Токены упущенной выгоды» сюда НЕ входят: они платятся из отдельного
        // пула компании и в этой сводке не показаны. Поэтому сумма
        // `State.total_referral_received` по всем партнёрам больше этого поля
        // ровно на сумму токенов (по 0.000001 USDT за токен).
        string total_referral_paid = 6;
        // ВЫПЛАЧЕНО бонусов за достижение рангов. Ещё не выплаченные сюда не
        // входят — они в `obligations_pending_amount`; два поля не пересекаются.
        string total_achievement_bonus_paid = 7;
        // Сумма невыплаченных обязательств по бонусам за ранги — долг компании
        // перед партнёрами. В доход партнёров (`State.total_earned`) ещё не
        // вошла.
        string obligations_pending_amount = 8;
        uint32 obligations_pending_count = 9;
        ServiceStatus.Id service_status = 10;
        // Созрели и ждут решения партнёра.
        uint32 deposits_matured = 11;
        // Сумма их тел — деньги, которые партнёры могут забрать в любой момент.
        // ВХОДИТ в `total_in_deposits` — прибавлять к нему нельзя.
        string matured_total = 12;
        // Выплачено экстра-прибыли всем партнёрам за всё время (модуль баланса
        // пула COMPANY STAKING EXTRA). В `total_income_paid` НЕ входит.
        //
        // Это итог по ВСЕМ партнёрам, для админа. Свою экстру партнёр видит в
        // клиентском `GetState`: `State.summary.total_extra_paid` и
        // `Deposit.total_extra_paid`.
        string total_extra_paid = 13;
    }
}
