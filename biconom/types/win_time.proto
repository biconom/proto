syntax = "proto3";

package biconom.types;

// Переиспользуемые модели данных подсистемы WinTime (игровой токен-баланс).
//
// Осталась только живая модель `WinTime.Balance` (поле `win_time` в
// `WalletCurrency.List`). Модели истории транзакций v1 (`TxType`, `TypeStat`,
// `TransactionGroup`, `Transaction`) удалены вместе со старым движком WinTime:
// текущая подсистема — событийный аккумулятор, её история отдаётся сервисом
// `biconom.client.wintime.WintimeService` (этапы статусов + пересчёт дохода).

// WinTime — пространство имён для моделей токен-баланса WinTime.
message WinTime {
    // Баланс WinTime владельца.
    message Balance {
        // Поля курсоров/статистики истории v1 (seq, group_seq, stats) удалены —
        // номера зарезервированы от переиспользования.
        reserved 2, 3, 4;
        int64 amount = 1; // Текущий баланс токенов (знаковый)
    }
}
